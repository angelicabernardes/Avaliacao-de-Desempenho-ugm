/* ============ Store (real db or local fallback) ============ */
var Store = (function(){
  var real = null, ready = null, useReal = false;
  var local = { evaluations: {} };
  var listeners = {}; // collection listeners for local mode

  function seedLocalDemo(){
    if(Object.keys(local.evaluations).length) return;
    var demoCargo = "ANALISTA DE SUPORTE TÉCNICO JR";
    var pos = positionData(demoCargo);
    var comp = (pos.suggestedCompetencies||[]).slice(0,5).map(function(c){ return {name:c.name, weight:4}; });
    var resp = (pos.responsibilities||[]).slice(0,5).map(function(r){ return {text:r.text, group:r.group, weight:3}; });
    var id = "demo1";
    local.evaluations[id] = {
      id:id, demo:true,
      employeeName:"Kauê Zulato Passini", employeeMatricula:12, employeeArea:"Suporte Técnico",
      employeeAdmissao:"19/04/2023", employeeGestor:"Danillo", cargo:demoCargo,
      evalDate:"2024-08-30", createdAt:Date.now(),
      competencyFactors:comp, responsibilityFactors:resp,
      selfScores:{}, managerScores:{}, melhorias:[{text:"Gestão do tempo e iniciativa nas tomadas de decisão.",prazo:"2025-01-04"}],
      employeeComments:"", signatures:{}, status:"aguardando_gestor"
    };
    comp.forEach(function(c,i){ local.evaluations[id].selfScores["c"+i]=4; });
    resp.forEach(function(r,i){ local.evaluations[id].selfScores["r"+i]=4; });
  }

  // frozen, cloned snapshot of a stored doc — mirrors the real db's immutable DocumentSnapshot,
  // so local/demo mode surfaces the same "don't mutate snap.data()" bugs instead of hiding them.
  function snapData(name,id){
    var d = local[name][id];
    return d ? Object.freeze(JSON.parse(JSON.stringify(d))) : undefined;
  }
  function buildQuerySnapshot(name){
    var docs = Object.keys(local[name]).map(function(id){
      return {id:id, exists:true, data:function(){return snapData(name,id);}, metadata:{fromCache:false,hasPendingWrites:false}};
    });
    return {docs:docs, size:docs.length, empty:docs.length===0, docChanges:function(){return [];}, metadata:{fromCache:false,hasPendingWrites:false}};
  }
  function localCollection(name){
    return {
      onSnapshot:function(cb){
        listeners[name]=listeners[name]||[]; listeners[name].push(cb);
        cb(buildQuerySnapshot(name));
        return function(){ var i=listeners[name].indexOf(cb); if(i>-1) listeners[name].splice(i,1); };
      },
      add:function(data){
        var id=uid(); data.id=id; local[name][id]=data; fireLocal(name); return Promise.resolve({id:id});
      },
      doc:function(id){ return localDoc(name,id); }
    };
  }
  // mirrors the real db's update() contract: nested plain objects merge recursively,
  // everything else (arrays included) replaces wholesale.
  function deepMerge(dst, src){
    Object.keys(src).forEach(function(k){
      var sv = src[k];
      var isPlain = sv && typeof sv==="object" && !Array.isArray(sv);
      if(isPlain && dst[k] && typeof dst[k]==="object" && !Array.isArray(dst[k])) deepMerge(dst[k], sv);
      else dst[k] = sv;
    });
    return dst;
  }
  function localDoc(name,id){
    return {
      id:id,
      get:function(){ var d=local[name][id]; return Promise.resolve({exists:!!d, data:function(){return snapData(name,id);}}); },
      set:function(data){ local[name][id]=data; fireLocal(name); fireLocalDoc(name,id); return Promise.resolve(); },
      update:function(data){ var d=local[name][id]||{}; deepMerge(d, data); local[name][id]=d; fireLocal(name); fireLocalDoc(name,id); return Promise.resolve(); },
      delete:function(){ delete local[name][id]; fireLocal(name); fireLocalDoc(name,id); return Promise.resolve(); },
      onSnapshot:function(cb){
        var key=name+"/"+id; listeners[key]=listeners[key]||[]; listeners[key].push(cb);
        cb({exists:!!local[name][id], data:function(){return snapData(name,id);}});
        return function(){ var i=listeners[key].indexOf(cb); if(i>-1) listeners[key].splice(i,1); };
      }
    };
  }
  function fireLocal(name){
    (listeners[name]||[]).forEach(function(cb){ cb(buildQuerySnapshot(name)); });
  }
  function fireLocalDoc(name,id){
    var key=name+"/"+id;
    (listeners[key]||[]).forEach(function(cb){ cb({exists:!!local[name][id], data:function(){return snapData(name,id);}}); });
  }

  ready = new Promise(function(resolve){
    try{
      if(!FIREBASE_READY){
        seedLocalDemo(); resolve(false); return;
      }
      real = firebase.firestore();
      useReal = true;
      resolve(true);
    }catch(e){ seedLocalDemo(); resolve(false); }
  });

  return {
    ready: ready,
    isDemo:function(){ return !useReal; },
    evaluations:function(){
      if(useReal) return real.collection("evaluations");
      return localCollection("evaluations");
    },
    evaluation:function(id){
      if(useReal) return real.collection("evaluations").doc(id);
      return localDoc("evaluations", id);
    }
  };
})();

/* ============ Scoring engine (mirrors the spreadsheet formulas) ============ */
function computeScores(e){
  function block(factors, scoresObj, prefix){
    var wsum=0, tsum=0, any=false;
    factors.forEach(function(f,i){
      var w = f.weight||0; wsum += w;
      var g = scoresObj[prefix+i]; // manager score drives the official total, as in the sheet (K = peso * nota gestor)
      if(g){ tsum += w*g; any=true; }
    });
    return {wsum:wsum, tsum:tsum, avg: (wsum && any) ? (tsum/wsum) : null, any:any};
  }
  var comp = block(e.competencyFactors||[], e.managerScores||{}, "c");
  var resp = block(e.responsibilityFactors||[], e.managerScores||{}, "r");
  var final = (comp.avg!=null && resp.avg!=null) ? (comp.avg+resp.avg)/2 : null;
  var label = null;
  if(final!=null){
    if(final<=1.49) label=1; else if(final<=2.49) label=2; else if(final<=3.49) label=3; else if(final<=4.49) label=4; else label=5;
  }
  return {comp:comp, resp:resp, final:final, label:label};
}

  var unsub = ref.onSnapshot(function(snap){
    if(!snap.exists || !canSeeEvaluation(Object.assign({id:id}, snap.data()||{}))){
      root.innerHTML = '<div class="empty"><div class="big">Avaliação não encontrada</div>'+(canSeeFullPanel()?'<a href="#/">Voltar ao painel</a>':'')+'</div>'; return;
    }
    var e = Object.assign({}, snap.data()||{}); e.id = id;
    renderBreadcrumb({page:"detail"}, e.employeeName);
    drawDetail(e, ref);
  }, function(){ toast("Não foi possível carregar esta avaliação."); });
  registerCleanup(unsub);
}

function chaListFor(name){ return (CATALOG.cha[name]||[]); }

function stageIndex(status){ return Math.max(0, STATUS_ORDER.indexOf(status)); }

function drawDetail(e, ref){
  var root = document.getElementById("view");
  var scores = computeScores(e);
  var idx = stageIndex(e.status);
  var stageNames = ["Autoavaliação","Feedback do gestor","Fechamento","Concluída"];
  var railClass = ["on-self","on-manager","on-close","on-done"][idx];

  var stepperHtml = '<div class="stepper">' + stageNames.map(function(name,i){
    var cls = i<idx?"done":(i===idx?"active":"");
    return '<div class="step '+cls+'"><div class="n">'+(i<idx?"✓":(i+1))+'</div><span class="label">'+name+'</span></div>'+(i<stageNames.length-1?'<span class="arrow">›</span>':'');
  }).join('') + '</div>';

  var html = '';
  html += '<div class="card stage-rail '+railClass+'"><div class="card-body">'+
    '<div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;">'+
      '<div><h2 style="margin:0 0 4px;font-size:19px;">'+esc(e.employeeName)+'</h2>'+
      '<div style="color:var(--text-muted);font-size:13px;">'+esc(e.cargo||"")+' · '+esc(e.employeeArea||"")+'</div></div>'+
      '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">'+
        '<span class="pill st-'+e.status+'"><span class="dot"></span>'+STATUS_LABELS[e.status]+'</span>'+
        (e.status==="aguardando_autoavaliacao" ? deadlineBadge(e.selfDeadline) : '')+
        (e.status==="aguardando_gestor" ? deadlineBadge(e.feedbackDeadline) : '')+
      '</div>'+
    '</div>'+
    '<div class="readout" style="margin-top:14px;">'+
      readoutItem("Gestor", e.employeeGestor)+readoutItem("Admissão", e.employeeAdmissao)+
      readoutItem("Data da avaliação", fmtDateISOtoBR(e.evalDate))+readoutItem("Matrícula", e.employeeMatricula)+
    '</div>'+
    stepperHtml+
    '<div class="no-print" style="display:flex;gap:8px;margin-top:6px;flex-wrap:wrap;">'+
      (isRHUnlocked() ? '<button class="btn small" onclick="window.print()">🖶 Imprimir / salvar PDF</button>' : '')+
      (e.status==="aguardando_autoavaliacao" ? '<button class="btn small" id="btn-notify-emp">✉️ Notificar colaborador</button>' : '')+
      (e.status!=="aguardando_autoavaliacao" && e.status!=="concluida" ? '<button class="btn small" id="btn-notify-mgr">✉️ Notificar gestor</button>' : '')+
      (isRHUnlocked() ? '<button class="btn small danger" id="btn-delete-eval">🗑️ Excluir avaliação</button>' : '')+
    '</div>'+
    (isRHUnlocked() ? '<p class="hint no-print" style="margin-top:8px;">Se o botão não abrir a caixa de impressão, use o atalho do teu computador com esta avaliação em foco: <b>Ctrl+P</b> (Windows) ou <b>⌘+P</b> (Mac) e escolha "Salvar como PDF".</p>' : '')+
  '</div></div>';

  html += '<div class="card"><div class="card-head"><h2>Critérios para a avaliação</h2></div><div class="card-body">'+
    '<div class="legend">'+
      [1,2,3,4,5].map(function(n){return '<span class="lg-item"><span class="sw" style="background:var(--s'+n+')"></span>'+n+' · '+SCORE_LABELS[n]+'</span>';}).join('')+
    '</div>'+
    '<p class="hint" style="margin-top:8px;">Peso do fator: 1 Pouco Relevante · 2 Desejável · 3 Importante · 4 Muito Importante · 5 Indispensável.</p>'+
  '</div></div>';

  html += factorSection("Fatores de Competência", "c", e.competencyFactors||[], e, ref, true);
  html += factorSection("Fatores de Responsabilidade", "r", e.responsibilityFactors||[], e, ref, false);

  html += '<div class="card"><div class="score-final">'+
    '<div class="meta"><span class="l">Pontuação final</span><span class="big">'+(scores.final!=null?fmt1(scores.final):'—')+'</span>'+
    (scores.label? '<span class="pill sc-'+scores.label+'">'+SCORE_LABELS[scores.label]+'</span>' : '')+
    '</div>'+
    '<div class="subscores">'+
      '<div class="item"><div class="v">'+(scores.comp.avg!=null?fmt1(scores.comp.avg):'—')+'</div><div class="l">Competência</div></div>'+
      '<div class="item"><div class="v">'+(scores.resp.avg!=null?fmt1(scores.resp.avg):'—')+'</div><div class="l">Responsabilidade</div></div>'+
    '</div>'+
  '</div></div>';

  html += meltoriaSection(e, ref, idx);
  html += closingSection(e, ref, idx, scores);

  root.innerHTML = html;
  wireFactorInputs(e, ref);
  wireStageActions(e, ref);
  wireMelhoria(e, ref);
  wireClosing(e, ref);
  var notifyEmp = document.getElementById("btn-notify-emp");
  if(notifyEmp) notifyEmp.addEventListener("click", function(){ notifyEmployeeEmail(e, e.id); });
  var notifyMgr = document.getElementById("btn-notify-mgr");
  if(notifyMgr) notifyMgr.addEventListener("click", function(){ notifyManagerEmail(e, e.id); });
  var delBtn = document.getElementById("btn-delete-eval");
  if(delBtn) delBtn.addEventListener("click", function(){ showDeleteConfirmModal(e, ref); });
}

function readoutItem(l,v){ return '<div><span>'+esc(l)+'</span><b>'+esc(v||"—")+'</b></div>'; }

function factorSection(title, prefix, factors, e, ref, showCha){
  var selfLocked = e.status !== "aguardando_autoavaliacao";
  var mgrLocked = e.status === "aguardando_autoavaliacao";
  var rows = factors.map(function(f, i){
    var key = prefix+i;
    var selfScore = (e.selfScores||{})[key];
    var mgrScore = (e.managerScores||{})[key];
    var total = (f.weight && mgrScore) ? f.weight*mgrScore : null;
    var chaBlock = "";
    if(showCha){
      var cha = chaListFor(f.name);
      if(cha.length){
        chaBlock = '<button type="button" class="cha-toggle" data-cha-toggle="'+i+'">↓ Ver visão SMART deste fator</button>'+
          '<div class="cha-panel" id="cha-'+prefix+i+'" hidden><p class="cha-title">'+esc(f.name)+' — o que observar</p><ul>'+
          cha.map(function(c){return '<li>'+esc(c.text)+'</li>';}).join('')+'</ul></div>';
      }
    }
    return '<tr>'+
      '<td>'+(f.group?'<div class="fac-group">'+esc(f.group)+'</div>':'')+'<div class="fac-name">'+esc(f.name||f.text)+'</div>'+
      (f.description?'<div class="hint" style="margin-top:2px;">'+esc(f.description)+'</div>':'')+chaBlock+'</td>'+
      '<td class="center num"><span class="weight-tag">'+ (f.weight||"—") +'</span></td>'+
      '<td class="center">'+scorePicker(prefix+"-self-"+i, key, selfScore, selfLocked)+'</td>'+
      '<td class="center">'+scorePicker(prefix+"-mgr-"+i, key, mgrScore, mgrLocked)+'</td>'+
      '<td class="center num">'+(total!=null?total:'–')+'</td>'+
    '</tr>';
  }).join('');
  var wsum=0,tsum=0;
  factors.forEach(function(f,i){ wsum+=f.weight||0; var m=(e.managerScores||{})[prefix+i]; if(m) tsum += (f.weight||0)*m; });
  return '<div class="card"><div class="card-head"><h2>'+title+'</h2>'+
    (mgrLocked && prefix==="c" ? '<span class="locked-note">Avaliação do gestor libera após o colaborador concluir a autoavaliação</span>' : '')+
    '</div><div class="card-body" style="padding:0;overflow-x:auto;">'+
    '<table class="ftable"><thead><tr><th style="width:44%">Fator</th><th class="center">Peso</th><th class="center">Autoavaliação</th><th class="center">Avaliação do gestor</th><th class="center">Total</th></tr></thead>'+
    '<tbody>'+rows+'</tbody>'+
    '<tfoot><tr class="foot"><td>Total</td><td class="center num">'+wsum+'</td><td></td><td></td><td class="center num">'+tsum+'</td></tr></tfoot>'+
    '</table></div></div>';
}

function scorePicker(name, key, value, locked){
  var html = '<div class="score-picker" data-key="'+key+'" data-name="'+name+'" data-locked="'+(locked?1:0)+'">';
  for(var n=1;n<=5;n++){
    html += '<button type="button" class="score-btn sel-'+n+(value===n?' active':'')+'" data-val="'+n+'" '+(locked?'disabled':'')+'>'+n+'</button>';
  }
  html += '</div><div class="score-label">'+(value?SCORE_LABELS[value]:'')+'</div>';
  return html;
}

function wireFactorInputs(e, ref){
  document.querySelectorAll('[data-cha-toggle]').forEach(function(btn){
    btn.addEventListener("click", function(){
      var panel = btn.nextElementSibling;
      if(panel){ panel.hidden = !panel.hidden; btn.textContent = (panel.hidden?'↓':'↑')+' Ver visão SMART deste fator'; }
    });
  });
  document.querySelectorAll('.score-picker').forEach(function(pk){
    if(pk.getAttribute("data-locked")==="1") return;
    pk.querySelectorAll('.score-btn').forEach(function(btn){
      btn.addEventListener("click", function(){
        var key = pk.getAttribute("data-key");
        var val = Number(btn.getAttribute("data-val"));
        var isMgr = pk.getAttribute("data-name").indexOf("-mgr-")>-1;
        var field = isMgr? "managerScores" : "selfScores";
        var patch = {}; patch[field] = Object.assign({}, e[field]||{});
        patch[field][key] = val;
        ref.update(patch);
      });
    });
  });
}

function allScored(factors, scoresObj, prefix){
  return factors.every(function(f,i){ return !!scoresObj[prefix+i]; });
}

function wireStageActions(e, ref){
  // inject stage-advance buttons into the stepper card area if applicable
  var actionsHost = document.querySelector('.stage-rail .card-body');
  if(!actionsHost) return;
  var bar = document.createElement("div");
  bar.className = "no-print";
  bar.style.marginTop = "14px";
  if(e.status==="aguardando_autoavaliacao"){
    var readyC = allScored(e.competencyFactors||[], e.selfScores||{}, "c");
    var readyR = allScored(e.responsibilityFactors||[], e.selfScores||{}, "r");
    bar.innerHTML = '<button class="btn primary" id="btn-finish-self" '+((readyC&&readyR)?'':'disabled')+'>Concluir autoavaliação</button>'+
      (!(readyC&&readyR) ? '<span class="hint" style="margin-left:10px;">Preencha todos os fatores para concluir.</span>' : '');
    actionsHost.appendChild(bar);
    var b = document.getElementById("btn-finish-self");
    if(b) b.addEventListener("click", function(){
      var selfSubmittedAt = todayISO();
      var feedbackDeadline = addDaysISO(selfSubmittedAt, FEEDBACK_DEADLINE_DAYS);
      ref.update({status:"aguardando_gestor", selfSubmittedAt:selfSubmittedAt, feedbackDeadline:feedbackDeadline}).then(function(){
        notifyManagerEmail(Object.assign({}, e, {feedbackDeadline:feedbackDeadline}), e.id);
      });
    });
  } else if(e.status==="aguardando_gestor"){
    var readyC2 = allScored(e.competencyFactors||[], e.managerScores||{}, "c");
    var readyR2 = allScored(e.responsibilityFactors||[], e.managerScores||{}, "r");
    bar.innerHTML = '<button class="btn primary" id="btn-finish-mgr" '+((readyC2&&readyR2)?'':'disabled')+'>Concluir avaliação de feedback</button>'+
      (!(readyC2&&readyR2) ? '<span class="hint" style="margin-left:10px;">Preencha a nota do gestor em todos os fatores.</span>' : '');
    actionsHost.appendChild(bar);
    var b2 = document.getElementById("btn-finish-mgr");
    if(b2) b2.addEventListener("click", function(){ ref.update({status:"aguardando_fechamento"}); toast("Feedback registrado. Colaborador e gestor já podem assinar."); });
  }
}

function meltoriaSection(e, ref, idx){
  var editable = idx>=1; // from feedback stage onward
  var rows = (e.melhorias||[]).map(function(m,i){
    return '<div class="melhoria-row"><input type="text" class="mel-text" data-i="'+i+'" value="'+esc(m.text)+'" placeholder="Ponto de melhoria / meta acordada" '+(editable?'':'disabled')+'>'+
      '<input type="date" class="mel-prazo" data-i="'+i+'" value="'+esc(m.prazo||"")+'" '+(editable?'':'disabled')+'>'+
      (editable? '<button class="icon-btn mel-del" data-i="'+i+'" title="Remover">✕</button>' : '<span></span>')+
      '</div>';
  }).join('') || '<p class="hint">Nenhum ponto de melhoria registrado ainda.</p>';
  return '<div class="card"><div class="card-head"><h2>Pontos de melhoria / metas</h2><div class="sub">Definidos com o colaborador ao final da reunião de feedback</div></div>'+
    '<div class="card-body">'+
    '<div id="mel-body">'+rows+'</div>'+
    (editable? '<div class="no-print" style="display:flex; gap:10px; margin-top:6px; flex-wrap:wrap;"><button class="btn small" id="mel-add">+ Adicionar ponto</button><button class="btn small primary" id="mel-save">💾 Salvar pontos</button></div>' : '')+
    '</div></div>';
}

function wireMelhoria(e, ref){
  var body = document.getElementById("mel-body");
  if(!body) return;
  function collect(){
    var list = [];
    body.querySelectorAll('.melhoria-row').forEach(function(row){
      var t = row.querySelector('.mel-text');
      var d = row.querySelector('.mel-prazo');
      list.push({text: t?t.value:"", prazo: d?d.value:""});
    });
    return list;
  }
  body.querySelectorAll('.mel-del').forEach(function(btn){
    btn.addEventListener("click", function(){
      var list = collect();
      list.splice(Number(btn.getAttribute("data-i")),1);
      ref.update({melhorias:list}).then(function(){ toast("Ponto removido."); });
    });
  });
  var addBtn = document.getElementById("mel-add");
  if(addBtn) addBtn.addEventListener("click", function(){
    var list = collect(); list.push({text:"",prazo:""}); ref.update({melhorias:list});
  });
  var saveBtn = document.getElementById("mel-save");
  if(saveBtn) saveBtn.addEventListener("click", function(){
    var list = collect();
    ref.update({melhorias:list}).then(function(){ toast("Pontos de melhoria salvos."); });
  });
}

function closingSection(e, ref, idx, scores){
  // observações liberam já na etapa de feedback do gestor (idx 1), igual aos pontos de melhoria —
  // o próprio gestor pode registrar o que o avaliado comentar durante a conversa.
  var obsEditable = idx>=1;
  return '<div class="card"><div class="card-head"><h2>Observações e fechamento</h2></div><div class="card-body">'+
    '<div class="field"><label for="obs">Observações do avaliado</label>'+
    '<textarea id="obs" placeholder="Percepção do avaliado sobre o processo — pode ser preenchida pelo gestor durante a conversa de feedback" '+(obsEditable?'':'disabled')+'>'+esc(e.employeeComments||"")+'</textarea></div>'+
    '<div class="sign-row" style="margin-top:14px;">'+
      '<div class="sign-box"><div class="who">Avaliado</div><div class="signed-name">'+esc(e.employeeName||"—")+'</div></div>'+
      '<div class="sign-box"><div class="who">Avaliador</div><div class="signed-name">'+esc(e.employeeGestor||"—")+'</div></div>'+
    '</div>'+
    '<p class="hint" style="margin-top:10px;">A assinatura oficial é feita via DocuSign, a partir do PDF gerado pelo RH — não é preciso assinar aqui.</p>'+
    (idx===2 ? '<div class="no-print" style="margin-top:14px;"><button class="btn primary" id="btn-finish-close">Concluir avaliação</button> <span class="hint">Marca a avaliação como concluída e pronta para impressão e assinatura.</span></div>' : '')+
  '</div></div>';
}

function wireClosing(e, ref){
  var obs = document.getElementById("obs");
  if(obs) obs.addEventListener("change", function(){ ref.update({employeeComments:obs.value}); });
  var finish = document.getElementById("btn-finish-close");
  if(finish) finish.addEventListener("click", function(){
    ref.update({status:"concluida", concludedAt:todayISO()}).then(function(){
      toast("Avaliação concluída — já pode ser impressa pelo RH.");
      notifyRHEmail(e, e.id);
    });
  });
}

/* ============ Render dispatcher ============ */
function render(){
  clearCleanup();
  var route = Router.parse();
  if(route.page==="dashboard") viewDashboard();
  else if(route.page==="new") viewNew();
  else if(route.page==="detail") viewDetail(route.id);
}

function updateUserBadge(user){
  var b = document.getElementById("ms-user-badge");
  if(!b) return;
  if(!user){ b.innerHTML = ""; return; }
  b.innerHTML = esc(user.name||user.email)+' · <a href="#" id="ms-logout-link">Sair</a>';
  var link = document.getElementById("ms-logout-link");
  if(link) link.addEventListener("click", function(ev){
    ev.preventDefault();
    MSAuth.logout();
    location.reload();
  });
}
function bootApp(user){
  var app = document.getElementById("app");
  if(!document.getElementById("view")) app.innerHTML = APP_SHELL_HTML;
  updateUserBadge(user);
  Store.ready.then(render);
  updateRHButton();
}
function loginErrorMessage(e){
  if(!e) return "";
  if(e.error==="wrong_domain") return "Essa conta ("+(e.description||"")+") não é @"+MSAUTH_ALLOWED_DOMAIN+" — entre com sua conta corporativa.";
  if(e.error==="auth/unauthorized-domain") return "Este site ainda não foi autorizado no Firebase (Authentication → Settings → Authorized domains) — adicione o domínio do GitHub Pages lá.";
  if(e.error==="auth/popup-blocked") return "O navegador bloqueou a janela de login — permita pop-ups para este site e tente de novo.";
  if(e.error==="auth/popup-closed-by-user" || e.error==="auth/cancelled-popup-request") return "Janela de login fechada antes de concluir — tente de novo.";
  return "Não foi possível entrar"+(e.description?" ("+e.description+")":"")+". Tente de novo.";
}
function renderLoginGate(err){
  var app = document.getElementById("app");
  app.innerHTML =
    '<div style="min-height:80vh;display:flex;align-items:center;justify-content:center;padding:24px;">'+
      '<div class="card" style="max-width:420px;width:100%;text-align:center;padding:32px 28px;"><div class="card-body">'+
        '<h2 style="margin:0 0 6px;">Avaliação de Desempenho</h2>'+
        '<p class="hint" style="margin-bottom:20px;">Acesso restrito à equipe umgrauemeio. Entre com sua conta Microsoft corporativa (@'+MSAUTH_ALLOWED_DOMAIN+').</p>'+
        (err ? '<p style="color:var(--s1);margin-bottom:14px;">'+esc(loginErrorMessage(err))+'</p>' : '')+
        '<button class="btn primary" id="ms-login-btn" style="width:100%;justify-content:center;">🔑 Entrar com a Microsoft</button>'+
      '</div></div>'+
    '</div>';
  var btn = document.getElementById("ms-login-btn");
  btn.addEventListener("click", function(){
    btn.disabled = true; btn.textContent = "Abrindo login...";
    MSAuth.signIn().then(function(user){
      bootApp(user);
    }).catch(function(e){
      renderLoginGate(e && e.code==="wrong_domain" ? MSAuth.lastError() : {error:e && e.code, description:e && e.message});
    });
  });
}
(function bootWithAuth(){
  MSAuth.ready.then(function(user){
    if(user) bootApp(user);
    else renderLoginGate(MSAuth.lastError());
  });
})();
window.Router = Router;
window.showRHGateModal = showRHGateModal;

})();
</script>
