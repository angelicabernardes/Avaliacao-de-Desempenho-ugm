<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Avaliação de Desempenho UGM</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Source+Sans+3:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  /* paleta oficial umgrauemeio (brandbook, "Sistema Cromático"): preto #151515, off-white #F0EFEF, vermelho #DC3333, laranja #F9A522 */
  --bg:#F0EFEF; --surface:#FFFFFF; --surface-2:#F7F6F5; --surface-3:#E7E5E3;
  --border:#DDDAD8; --border-strong:#C6C2BF;
  --text:#151515; --text-muted:#5C5854; --text-faint:#96918C;
  --accent:#DC3333; --accent-strong:#B92B2B; --accent-soft:#FBE2E0; --accent-contrast:#FFFFFF;
  --accent2:#F9A522; --accent2-strong:#DA8D14; --accent2-soft:#FCEBCE; --accent2-contrast:#201505;
  --s1:#D6483F; --s1-soft:#FBE2DE; --s2:#E28A3B; --s2-soft:#FCEAD6; --s3:#C99A2E; --s3-soft:#F5E9C9;
  --s4:#6E9C4C; --s4-soft:#E7EFDD; --s5:#2F8354; --s5-soft:#DCEEE1;
  --st-draft:#8B8681; --st-draft-soft:#EBE9E7; --st-self:#F9A522; --st-self-soft:#FCEBCE;
  --st-manager:#DC3333; --st-manager-soft:#FBE2E0; --st-done:#151515; --st-done-soft:#E3E1DF;
  --shadow: 0 1px 2px rgba(21,21,21,.07), 0 4px 16px rgba(21,21,21,.06);
  color-scheme: light;
}
/* A pedido da Angélica: em vez de um modo escuro de verdade (fundo preto), o
   fundo continua sempre no off-white da marca (#F0EFEF) e o texto no preto
   (#151515), mesmo quando o sistema está no tema escuro ou alguém força
   data-theme="dark" — por isso os blocos abaixo repetem a mesma paleta clara. */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#F0EFEF; --surface:#FFFFFF; --surface-2:#F7F6F5; --surface-3:#E7E5E3;
    --border:#DDDAD8; --border-strong:#C6C2BF;
    --text:#151515; --text-muted:#5C5854; --text-faint:#96918C;
    --accent:#DC3333; --accent-strong:#B92B2B; --accent-soft:#FBE2E0; --accent-contrast:#FFFFFF;
    --accent2:#F9A522; --accent2-strong:#DA8D14; --accent2-soft:#FCEBCE; --accent2-contrast:#201505;
    --s1:#D6483F; --s1-soft:#FBE2DE; --s2:#E28A3B; --s2-soft:#FCEAD6; --s3:#C99A2E; --s3-soft:#F5E9C9;
    --s4:#6E9C4C; --s4-soft:#E7EFDD; --s5:#2F8354; --s5-soft:#DCEEE1;
    --st-draft:#8B8681; --st-draft-soft:#EBE9E7; --st-self:#F9A522; --st-self-soft:#FCEBCE;
    --st-manager:#DC3333; --st-manager-soft:#FBE2E0; --st-done:#151515; --st-done-soft:#E3E1DF;
    --shadow: 0 1px 2px rgba(21,21,21,.07), 0 4px 16px rgba(21,21,21,.06);
    color-scheme: light;
  }
}
:root[data-theme="dark"]{
  --bg:#F0EFEF; --surface:#FFFFFF; --surface-2:#F7F6F5; --surface-3:#E7E5E3;
  --border:#DDDAD8; --border-strong:#C6C2BF;
  --text:#151515; --text-muted:#5C5854; --text-faint:#96918C;
  --accent:#DC3333; --accent-strong:#B92B2B; --accent-soft:#FBE2E0; --accent-contrast:#FFFFFF;
  --accent2:#F9A522; --accent2-strong:#DA8D14; --accent2-soft:#FCEBCE; --accent2-contrast:#201505;
  --s1:#D6483F; --s1-soft:#FBE2DE; --s2:#E28A3B; --s2-soft:#FCEAD6; --s3:#C99A2E; --s3-soft:#F5E9C9;
  --s4:#6E9C4C; --s4-soft:#E7EFDD; --s5:#2F8354; --s5-soft:#DCEEE1;
  --st-draft:#8B8681; --st-draft-soft:#EBE9E7; --st-self:#F9A522; --st-self-soft:#FCEBCE;
  --st-manager:#DC3333; --st-manager-soft:#FBE2E0; --st-done:#151515; --st-done-soft:#E3E1DF;
  --shadow: 0 1px 2px rgba(21,21,21,.07), 0 4px 16px rgba(21,21,21,.06);
  color-scheme: light;
}

*{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:"Source Sans 3", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size:15px; line-height:1.5;
}
h1,h2,h3,.display{ font-family:"Archivo", "Source Sans 3", sans-serif; text-wrap:balance; letter-spacing:-0.01em; }
.mono, .num, input.num-input, .score-btn, .pill, td.num{ font-family:"IBM Plex Mono", ui-monospace, monospace; font-variant-numeric:tabular-nums; }
a{color:var(--accent);}
button{font-family:inherit;}
::selection{ background:var(--accent-soft); }
:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

.eyebrow{ text-transform:uppercase; letter-spacing:.08em; font-size:11.5px; color:var(--text-faint); font-weight:600; }

/* ---------- shell ---------- */
#app{ min-height:100%; display:flex; flex-direction:column; }
.topbar{
  position:sticky; top:0; z-index:20; background:var(--surface); border-bottom:1px solid var(--border);
  padding:14px clamp(16px,4vw,32px); display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;
}
.brand{ display:flex; align-items:center; gap:12px; cursor:pointer; }
.brand.no-nav{ cursor:default; }
.brand .mark{
  width:38px; height:38px; border-radius:9px; background:var(--accent); color:var(--accent-contrast);
  display:flex; align-items:center; justify-content:center; font-family:"Archivo",sans-serif; font-weight:800; font-size:15px; flex:none;
}
.brand .lines{ display:flex; flex-direction:column; gap:1px; }
.brand h1{ margin:0; font-size:17px; font-weight:700; }
.brand .eyebrow{ margin:0; }
.topbar nav{ display:flex; align-items:center; gap:8px; font-size:13.5px; color:var(--text-muted); }
.topbar nav a{ text-decoration:none; color:var(--text-muted); }
.topbar nav a:hover{ color:var(--text); }
.topbar nav .sep{ color:var(--text-faint); }
.topbar nav .current{ color:var(--text); font-weight:600; }

main{ flex:1; width:100%; }
.wrap{ max-width:1180px; margin:0 auto; padding:28px clamp(16px,4vw,32px) 64px; }
.wrap.narrow{ max-width:840px; }

/* ---------- buttons / form basics ---------- */
.btn{
  appearance:none; border:1px solid var(--border-strong); background:var(--surface); color:var(--text);
  padding:9px 16px; border-radius:8px; font-size:13.5px; font-weight:600; cursor:pointer; display:inline-flex; align-items:center; gap:8px;
  transition:background .12s, border-color .12s, transform .05s; text-decoration:none;
}
.btn:hover{ background:var(--surface-2); }
.btn:active{ transform:translateY(1px); }
.btn.primary{ background:var(--accent); border-color:var(--accent); color:var(--accent-contrast); }
.btn.primary:hover{ background:var(--accent-strong); border-color:var(--accent-strong); }
.btn.ghost{ border-color:transparent; background:transparent; }
.btn.ghost:hover{ background:var(--surface-2); }
.btn.small{ padding:6px 11px; font-size:12.5px; }
.btn[disabled]{ opacity:.45; cursor:not-allowed; }
.btn.danger{ color:var(--s1); border-color:var(--s1); }

label{ font-size:12.5px; font-weight:600; color:var(--text-muted); display:block; margin-bottom:5px; }
input[type=text], input[type=date], input[type=search], select, textarea{
  width:100%; padding:9px 11px; border-radius:7px; border:1px solid var(--border-strong);
  background:var(--surface); color:var(--text); font-size:14px; font-family:inherit;
}
textarea{ resize:vertical; min-height:64px; }
.field{ margin-bottom:16px; }
.grid2{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
.grid3{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px; }
@media (max-width:640px){ .grid2,.grid3{ grid-template-columns:1fr; } }

/* ---------- card / section ---------- */
.card{ background:var(--surface); border:1px solid var(--border); border-radius:14px; box-shadow:var(--shadow); }
.card + .card{ margin-top:18px; }
.card .card-head{ padding:18px 22px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
.card .card-head h2{ margin:0; font-size:16.5px; }
.card .card-head .sub{ font-size:12.5px; color:var(--text-muted); margin-top:2px; }
.card .card-body{ padding:20px 22px; }
.stage-rail{ border-left:4px solid var(--border-strong); }
.stage-rail.on-self{ border-left-color:var(--st-self); }
.stage-rail.on-manager{ border-left-color:var(--st-manager); }
.stage-rail.on-close{ border-left-color:var(--accent); }
.stage-rail.on-done{ border-left-color:var(--st-done); }

/* ---------- pills ---------- */
.pill{ display:inline-flex; align-items:center; gap:6px; padding:4px 10px; border-radius:99px; font-size:11.5px; font-weight:700; letter-spacing:.01em; white-space:nowrap; }
.pill .dot{ width:6px; height:6px; border-radius:99px; background:currentColor; }
.pill.st-aguardando_autoavaliacao{ background:var(--st-self-soft); color:var(--st-self); }
.pill.st-aguardando_gestor{ background:var(--st-manager-soft); color:var(--st-manager); }
.pill.st-aguardando_fechamento{ background:var(--accent-soft); color:var(--accent); }
.pill.st-concluida{ background:var(--st-done-soft); color:var(--st-done); }
.pill.sc-1{ background:var(--s1-soft); color:var(--s1); } .pill.sc-2{ background:var(--s2-soft); color:var(--s2); }
.pill.sc-3{ background:var(--s3-soft); color:var(--s3); } .pill.sc-4{ background:var(--s4-soft); color:var(--s4); }
.pill.sc-5{ background:var(--s5-soft); color:var(--s5); }

/* ---------- stepper ---------- */
.stepper{ display:flex; align-items:center; gap:0; margin:18px 0 4px; flex-wrap:wrap; }
.stepper .step{ display:flex; align-items:center; gap:8px; padding:6px 12px 6px 6px; border-radius:99px; }
.stepper .step .n{ width:22px; height:22px; border-radius:99px; background:var(--surface-3); color:var(--text-muted); font-size:11px; font-weight:700; display:flex; align-items:center; justify-content:center; flex:none; }
.stepper .step.active .n{ background:var(--accent); color:var(--accent-contrast); }
.stepper .step.done .n{ background:var(--st-done-soft); color:var(--st-done); }
.stepper .step span.label{ font-size:12.5px; font-weight:600; color:var(--text-muted); }
.stepper .step.active span.label{ color:var(--text); }
.stepper .arrow{ color:var(--border-strong); margin:0 2px; font-size:13px; }

/* ---------- dashboard ---------- */
.dash-head{ display:flex; justify-content:space-between; align-items:flex-end; gap:16px; flex-wrap:wrap; margin-bottom:20px; }
.dash-head h1{ font-size:26px; margin:0 0 4px; }
.dash-head p{ margin:0; color:var(--text-muted); font-size:14px; max-width:56ch; }
.filters{ display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap; }
.filters input[type=search]{ max-width:280px; }
.filters select{ width:auto; }
.stat-row{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:20px; }
@media (max-width:760px){ .stat-row{ grid-template-columns:repeat(2,1fr); } }
.stat{ background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:14px 16px; }
.stat .v{ font-family:"IBM Plex Mono",monospace; font-size:22px; font-weight:600; }
.stat .l{ font-size:12px; color:var(--text-muted); margin-top:2px; }

.table-wrap{ overflow-x:auto; border:1px solid var(--border); border-radius:14px; background:var(--surface); box-shadow:var(--shadow); }
table.dash{ width:100%; border-collapse:collapse; min-width:760px; }
table.dash th{ text-align:left; font-size:11.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-faint); font-weight:700; padding:12px 16px; border-bottom:1px solid var(--border); white-space:nowrap; }
table.dash td{ padding:13px 16px; border-bottom:1px solid var(--border); vertical-align:middle; font-size:13.5px; }
table.dash tr:last-child td{ border-bottom:none; }
table.dash tr:hover td{ background:var(--surface-2); }
.person .name{ font-weight:600; }
.person .role{ font-size:12px; color:var(--text-muted); }
.row-actions{ display:flex; gap:6px; flex-wrap:wrap; }
.empty{ padding:56px 24px; text-align:center; color:var(--text-muted); }
.empty .big{ font-size:15px; color:var(--text); font-weight:600; margin-bottom:6px; }

/* ---------- wizard ---------- */
.wizard-section{ padding:20px 0; border-top:1px solid var(--border); }
.wizard-section:first-child{ border-top:none; padding-top:0; }
.wizard-section h3{ margin:0 0 3px; font-size:14.5px; }
.wizard-section .hint{ font-size:12.5px; color:var(--text-muted); margin:0 0 14px; }
.readout{ background:var(--surface-2); border-radius:10px; padding:12px 14px; font-size:13px; display:grid; grid-template-columns:repeat(4,1fr); gap:10px 16px; }
@media (max-width:700px){ .readout{ grid-template-columns:1fr 1fr; } }
.readout div b{ display:block; font-weight:700; }
.readout div span{ color:var(--text-muted); font-size:11.5px; text-transform:uppercase; letter-spacing:.04em; }

.cat-group{ margin-bottom:14px; }
.cat-group .cat-title{ font-size:11.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-faint); font-weight:700; margin:0 0 8px; }
.factor-check{ display:flex; align-items:flex-start; gap:10px; padding:9px 10px; border-radius:8px; border:1px solid transparent; }
.factor-check:hover{ background:var(--surface-2); }
.factor-check input[type=checkbox]{ margin-top:3px; width:16px; height:16px; accent-color:var(--accent); flex:none; }
.factor-check .fname{ font-weight:600; font-size:13.5px; }
.factor-check .fdesc{ font-size:12.5px; color:var(--text-muted); margin-top:2px; }
.factor-check .fweight{ margin-left:auto; flex:none; width:190px; font-size:13px; }
@media (max-width:600px){ .factor-check{ flex-wrap:wrap; } .factor-check .fweight{ width:100%; margin-left:26px; } }
.selcount{ font-size:12.5px; font-weight:700; padding:3px 9px; border-radius:99px; background:var(--surface-3); }
.selcount.ok{ background:var(--accent-soft); color:var(--accent); }
.resp-row{ display:flex; gap:10px; align-items:flex-start; padding:10px; border-radius:8px; }
.resp-row:hover{ background:var(--surface-2); }
.resp-row input[type=checkbox]{ margin-top:4px; width:16px; height:16px; accent-color:var(--accent); flex:none; }
.resp-row .rtext{ font-size:13.5px; flex:1; }
.resp-row .rgroup{ font-size:11px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.03em; font-weight:700; margin-bottom:2px; }
.resp-row .rweight{ width:190px; flex:none; font-size:13px; }
@media (max-width:600px){ .resp-row{ flex-wrap:wrap; } .resp-row .rweight{ width:100%; margin-left:26px; } }

/* ---------- factor table (detail) ---------- */
.legend{ display:flex; gap:18px; flex-wrap:wrap; font-size:12.5px; color:var(--text-muted); }
.legend .lg-item{ display:flex; align-items:center; gap:6px; }
.legend .sw{ width:10px; height:10px; border-radius:3px; }
.ftable{ width:100%; border-collapse:collapse; }
.ftable th{ text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--text-faint); font-weight:700; padding:8px 10px; border-bottom:1px solid var(--border); }
.ftable td{ padding:12px 10px; border-bottom:1px solid var(--border); vertical-align:top; font-size:13.5px; }
.ftable tr:last-child td{ border-bottom:none; }
.ftable .fac-name{ font-weight:600; }
.ftable .fac-group{ font-size:11px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.03em; font-weight:700; margin-bottom:3px; }
.ftable td.center{ text-align:center; }
.ftable .foot td{ font-weight:700; background:var(--surface-2); }
.cha-toggle{ background:none; border:none; color:var(--accent); font-size:12px; font-weight:700; cursor:pointer; padding:2px 0; margin-top:4px; display:inline-flex; align-items:center; gap:4px; }
.cha-panel{ margin-top:8px; background:var(--accent-soft); border-radius:8px; padding:10px 12px; font-size:12.5px; }
.cha-panel ul{ margin:4px 0 0; padding-left:18px; }
.cha-panel li{ margin-bottom:4px; }
.cha-panel .cha-title{ font-weight:700; margin:0; }

.score-picker{ display:inline-flex; gap:3px; }
.score-btn{ width:30px; height:28px; border-radius:6px; border:1px solid var(--border-strong); background:var(--surface); color:var(--text-muted); font-size:12.5px; font-weight:700; cursor:pointer; }
.score-btn:hover{ background:var(--surface-2); }
.score-btn.sel-1.active{ background:var(--s1); border-color:var(--s1); color:#fff; }
.score-btn.sel-2.active{ background:var(--s2); border-color:var(--s2); color:#fff; }
.score-btn.sel-3.active{ background:var(--s3); border-color:var(--s3); color:#fff; }
.score-btn.sel-4.active{ background:var(--s4); border-color:var(--s4); color:#fff; }
.score-btn.sel-5.active{ background:var(--s5); border-color:var(--s5); color:#fff; }
.score-picker[data-locked="1"] .score-btn{ opacity:.4; cursor:not-allowed; }
.score-label{ font-size:11px; color:var(--text-muted); margin-top:4px; min-height:14px; }
.locked-note{ font-size:11.5px; color:var(--text-faint); font-style:italic; }
.weight-tag{ font-size:12px; font-weight:700; color:var(--text-muted); }

.score-final{ display:flex; align-items:center; gap:22px; padding:22px; flex-wrap:wrap; }
.score-final .big{ font-family:"IBM Plex Mono",monospace; font-size:40px; font-weight:600; line-height:1; }
.score-final .meta{ display:flex; flex-direction:column; gap:2px; }
.score-final .meta .l{ font-size:12px; color:var(--text-muted); }
.subscores{ display:flex; gap:26px; margin-left:auto; flex-wrap:wrap; }
.subscores .item{ text-align:right; }
.subscores .item .v{ font-family:"IBM Plex Mono",monospace; font-size:18px; font-weight:600; }
.subscores .item .l{ font-size:11px; color:var(--text-muted); }

.melhoria-row{ display:grid; grid-template-columns:1fr 150px 32px; gap:10px; margin-bottom:10px; align-items:start; }
@media (max-width:600px){ .melhoria-row{ grid-template-columns:1fr; } }
.icon-btn{ background:none; border:1px solid var(--border-strong); border-radius:7px; width:32px; height:36px; cursor:pointer; color:var(--text-muted); }
.icon-btn:hover{ background:var(--surface-2); color:var(--s1); }

.sign-row{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
@media (max-width:640px){ .sign-row{ grid-template-columns:1fr; } }
.sign-box{ border:1px dashed var(--border-strong); border-radius:10px; padding:16px; }
.sign-box.signed{ border-style:solid; border-color:var(--st-done); background:var(--st-done-soft); }
.sign-box .who{ font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:var(--text-muted); font-weight:700; margin-bottom:8px; }
.sign-box .signed-name{ font-family:"Archivo",sans-serif; font-size:20px; font-weight:600; }
.sign-box .signed-date{ font-size:12px; color:var(--text-muted); }

.toast{ position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--text); color:var(--bg); padding:10px 18px; border-radius:99px; font-size:13px; font-weight:600; box-shadow:var(--shadow); z-index:60; opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; }
.modal-overlay{ position:fixed; inset:0; background:rgba(10,18,15,.5); display:flex; align-items:center; justify-content:center; z-index:70; padding:20px; }
.modal-card{ background:var(--surface); border-radius:14px; box-shadow:var(--shadow); max-width:520px; width:100%; padding:22px; max-height:90vh; overflow-y:auto; }
.modal-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
.modal-head h3{ margin:0; font-size:16.5px; }
.modal-card textarea{ font-family:inherit; font-size:13px; }
.modal-card input[readonly], .modal-card textarea[readonly]{ background:var(--surface-2); color:var(--text-muted); }
.toast.show{ opacity:1; transform:translateX(-50%) translateY(-6px); }

.banner{ background:var(--accent-soft); color:var(--accent-strong); border-radius:10px; padding:12px 16px; font-size:13px; margin-bottom:18px; }
.banner.warn{ background:var(--s2-soft); color:var(--s2); }

/* ---------- print ---------- */
@media print{
  :root{
    --bg:#FFFFFF !important; --surface:#FFFFFF !important; --surface-2:#F5F4F3 !important; --surface-3:#EBE9E7 !important;
    --border:#D3CFCC !important; --border-strong:#BDB8B4 !important;
    --text:#151515 !important; --text-muted:#4A4642 !important; --text-faint:#7C7772 !important;
    --accent:#DC3333 !important; --accent-strong:#B92B2B !important; --accent-soft:#F7DEDC !important; --accent-contrast:#FFFFFF !important;
    --accent2:#F9A522 !important; --accent2-strong:#DA8D14 !important; --accent2-soft:#FBE7C9 !important; --accent2-contrast:#201505 !important;
    --s1:#D6483F !important; --s1-soft:#F7DEDA !important; --s2:#E28A3B !important; --s2-soft:#F9E6D2 !important; --s3:#C99A2E !important; --s3-soft:#F2E6C5 !important;

 Organização","Adaptabilidade e Inteligência Emocional","Atitude Empreendedora e Tomada de Decisão","Liderança, Cultura e Ética"],"competencyFactors":[{"id":1,"name":"Adaptabilidade e flexibilidade","description":"Facilidade para lidar com mudanças rápidas, imprevistos e novos cenários.","category":"Adaptabilidade e Inteligência Emocional"},{"id":2,"name":"Assertividade","description":"Trata de estabelecer metas e objetivos em linha com a realidade que o cerca (pois dinheiro não dorme e geralmente não temos uma segunda chance de reverter um prejuízo - trabalhar em finanças é como fazer teatro. O espetáculo é ao vivo e não pode ser editado, portanto temos que fazer bem da primeira vez).","category":"Liderança, Cultura e Ética"},{"id":3,"name":"Auto-Critica","description":"Processo de análise crítica sobre seus próprios atos, considerando principalmente os erros que eventualmente tenha cometido, com suas perspectivas de correção e aprimoramento.","category":"Adaptabilidade e Inteligência Emocional"},{"id":4,"name":"Comprometimento efetivo","description":"Lidera pelo exemplo, está comprometido e quando diz \"podem contar comigo\" não fica apenas nas palavras mas demonstra com ações.","category":"Liderança, Cultura e Ética"},{"id":5,"name":"Comunicação","description":"Escuta atentamente e expressa suas ideias, verbalmente e por escrito, usando uma linguagem clara e objetiva e certificando-se do entendimento das mensagens transmitidas ou recebidas. Adota o meio de comunicação adequado ao conteúdo e contexto da informação.","category":"Comunicação de Alto Impacto"},{"id":6,"name":"Controle de custos","description":"Refere-se ao empenho do avaliado em controlar os custos e aumentar  sua  produtividade  individual,  de  sua  equipe  de  trabalho  e  dos recursos disponíveis.","category":"Gestão, Eficiência e Organização"},{"id":7,"name":"Criatividade","description":"Está aberto às inovações e melhores práticas do mercado, visando implementar novas técnicas e procedimentos em sua área. Propõe ideias e soluções inovadoras e possíveis de executar e administra eventuais dificuldade para sua implantação.","category":"Atitude Empreendedora e Tomada de Decisão"},{"id":8,"name":"Cumprimento de prazos finais","description":"Trata a frequência com que o avaliado cumpre tempos, prazos e compromissos firmados.","category":"Gestão, Eficiência e Organização"},{"id":9,"name":"Desenvoltura oral e escrita","description":"Trata da fluência verbal do avaliado e a sua habilidade de escrever correta, clara e objetivamente.","category":"Comunicação de Alto Impacto"},{"id":10,"name":"Disponibilidade","description":"Se refere a estar disponível para os colaboradores e superiores, faz parte do time e as pessoas sabem que podem contar com você.","category":"Colaboração e Relacionamento Humano"},{"id":11,"name":"Empatia","description":"Capacidade de se colocar no lugar do outro para entender seus sentimentos e dores.","category":"Colaboração e Relacionamento Humano"},{"id":12,"name":"Escuta ativa","description":"Ouvir as pessoas com atenção real, tentando entender, e não apenas esperando a sua vez de falar.","category":"Comunicação de Alto Impacto"},{"id":13,"name":"Ética","description":"Respeita e segue os procedimentos do Grupo, é justo e correto com os colegas e com a empresa.","category":"Liderança, Cultura e Ética"},{"id":14,"name":"Feedback","description":"Trata de manter a prática do retorno de infomação com seus subordinados, pares e chefes.","category":"Comunicação de Alto Impacto"},{"id":15,"name":"Formador de times e equipes (coaching)","description":"Sem medo de competição, você prepara seus sucessores e cria um time tão forte que a sinergia é fator de sucesso dele como gestor e dos demais como integrantes (mais do que estrelar o espetáculo, devemos ter um bom elenco).","category":"Liderança, Cultura e Ética"},{"id":16,"name":"Gestão de Conflitos","description":"Habilidade de acalmar brigas e resolver desentendimentos na equipe de forma pacífica.","category":"Colaboração e Relacionamento Humano"},{"id":17,"name":"Habilidade para analisar e resolver problemas","description":"Refere-se à capacidade do avaliado em avaliar situações e propor alternativas e soluções coerentes.","category":"Liderança, Cultura e Ética"},{"id":18,"name":"Iniciativa","description":"Refere-se à disposição do avaliado para tomar atitudes, resolver problemas e reagir sem precisar de comando ou  solicitação prévia, contribuindo para andamento e melhoria do trabalho.","category":"Atitude Empreendedora e Tomada de Decisão"},{"id":19,"name":"Inteligência Emocional","description":"Descreve a capacidade de reconhecer e avaliar os seus próprios sentimentos e os dos outros, assim como a capacidade de lidar com eles","category":"Adaptabilidade e Inteligência Emocional"},{"id":20,"name":"Inteligência Interpessoal","description":"Refere-se a se relacionar bem com todos e cria parcerias efetivas de sucesso (pessoal e profissional).","category":"Colaboração e Relacionamento Humano"},{"id":21,"name":"Mentalidade de crescimento (Aprendizado contínuo)","description":"Vontade de aprender coisas novas o tempo todo e aceitar desafios.","category":"Adaptabilidade e Inteligência Emocional"},{"id":22,"name":"Organização","description":"Refere-se à capacidade do avaliado em trabalhar de modo organizado  e em conformidade com normas, instruções e procedimentos.","category":"Gestão, Eficiência e Organização"},{"id":23,"name":"Orientado para resultados","description":"Estabelece prioridades, organiza as atividades e as executa adequadamente. Não mede esforços para atingir as metas definidas com a diretoria. Não perde o foco e transpõe as barreiras para gerar resultados positivos para a empresa.","category":"Gestão, Eficiência e Organização"},{"id":24,"name":"Pensamento estratégico e negociação","description":"Saber exatamente para onde ir e, ao mesmo tempo, ter o jogo de cintura necessário para convencer as pessoas a caminharem junto com você.","category":"Atitude Empreendedora e Tomada de Decisão"},{"id":25,"name":"Priorização correta de tarefas","description":"Trata da habilidade de gerenciar o cronograma de trabalho e priorizar adequadamente tarefas e metas.","category":"Gestão, Eficiência e Organização"},{"id":26,"name":"Resiliência","description":"Capacidade de lidar com problemas, aguentar a pressão e dar a volta por cima após um erro.","category":"Adaptabilidade e Inteligência Emocional"},{"id":27,"name":"Senso de dono","description":"Parar de pensar \"esse problema não é meu\" e passar a pensar \"o que eu posso fazer para resolver isso?","category":"Atitude Empreendedora e Tomada de Decisão"},{"id":28,"name":"Tomada de decisão","description":"Saber escolher o melhor caminho com rapidez e responsabilidade quando surgem caminhos difíceis.","category":"Atitude Empreendedora e Tomada de Decisão"},{"id":29,"name":"Trabalho em equipe / Cooperação","description":"Interage e mantém bom relacionamento com seus pares, superiores e outras equipes e coopera no compartilhamento de ideias, atividades e soluções com os membros da equipe e das demais áreas.","category":"Colaboração e Relacionamento Humano"},{"id":30,"name":"Transparência","description":"Refere-se a se apresentar de forma clara, transparente, segura e de fácil acesso toda informação importante para a empresa.","category":"Comunicação de Alto Impacto"}],"positions":{"ADVOGADO JR":{"responsibilities":[{"order":1,"group":"Gerir Processos","text":"Postular em juízo, propondo e contestando ações, intervindo no curso do processo, solicitando providências necessárias junto ao magistrado ou ministério público, avaliando provas documentais e orais, instruindo a parte, realizando audiências, recorrendo de decisões quando cabível e cumprindo com prazos legais;"},{"order":2,"group":"Gerir Processos","text":"Prestar assessoria jurídica, apoiando na execução das atividades de consultoria e assessoramento jurídico aos clientes internos e externos;"},{"order":3,"group":"Gerir Processos","text":"Exercer advocacia empresarial, acompanhando realizações de atos societários, elaborando documentos pertinentes, assessorando decisões da diretoria, protegendo a propriedade industrial, avaliando normas e procedimentos internos e elaborando contratos;"},{"order":4,"group":"Busca Orientações","text":"Participar de processos de auditoria jurídica como auditado, prestando esclarecimentos técnicos e jurídicos, organizando e apresentando documentos solicitados, contribuindo para o entendimento dos processos internos e apoiando a implementação de melhorias decorrentes das recomendações recebidas, conforme cronograma definido pela área auditora."},{"order":5,"group":"Pesquisa","text":"Definir natureza jurídica da questão, coletando informações pertinentes, realizando pesquisas, interpretando normas e validar estratégia de atuação;"},{"order":6,"group":"Compromisso Valores","text":"Administrar bens e direitos, zelando pela manutenção e integridade de bens e informando sobre andamento de processos."}],"suggestedCompetencies":[{"order":1,"name":"Habilidade para analisar e resolver problemas"},{"order":2,"name":"Pensamento estratégico e negociação"},{"order":3,"name":"Comunicação"},{"order":4,"name":"Senso de dono"},{"order":5,"name":"Iniciativa"}]},"ANALISTA DE SUPRIMENTOS (COMPRAS)":{"responsibilities":[{"order":1,"group":"Pesquisa","text":"Desenvolver parecerias estratégicas com fornecedores e prestadores de serviços, visando colaboração e relacionamento sustentável a longo prazo de forma a beneficiar todas as partes e otimizando a eficiência operacional e financeira da companhia"},{"order":2,"group":"Capacidade Analítica","text":"Analisar requisições de compra e emitir pedidos no sistema, garantindo que estejam alinhados com os critérios técnicos e operacionais definidos."},{"order":3,"group":"Pesquisa","text":"Contribuir na identificação de equipamentos alternativos que atendam aos requisitos dos projetos, promovendo soluções que otimizem prazos e custos na cadeia de suprimentos."},{"order":4,"group":"Pesquisa","text":"Contribuir para identificação e homologação de novas tecnologias, realizando cotações solicitando amostras para fornecedores"},{"order":5,"group":"Gerir Processos","text":"Executar o processo de aquisição de materiais de acordo com os processos definidos, garantindo qualidade dos produtos comprados, negociando prazo e valor e acompanhando o status das entregas e realizando follow-up com os setores envolvidos contribuindo para o cumprimento das entregas operacionais dentro do cronograma e do orçamento"},{"order":6,"group":"Controle","text":"Atualizar os dados de compras no ERP e nos sistemas internos, assegurando consistência, rastreabilidade e disponibilidade das informações para os demais times."},{"order":7,"group":"Gerir Processos","text":"Apoiar as atividades da cadeia de suprimentos, atuando em processos de estoque, controle de ativos, recondicionamento de materiais, logística de implantação e desmobilização de projetos, conforme demandas operacionais."},{"order":8,"group":"Controle","text":"Realizar o levantamento e a consolidação das métricas de performance da área de suprimentos, organizando os dados de forma estruturada para apoiar a tomada de decisão e a melhoria dos processos."},{"order":9,"group":"Ajuda Mútua","text":"Propor e participar de projetos de melhoria contínua na área de suprimentos, contribuindo com ideias, análises e ações que promovam maior eficiência operacional e otimização de recursos."},{"order":10,"group":"Capacidade Analítica","text":"Desenvolver e manter sistemas internos que suportem o funcionamento eficiente do fluxo de suprimentos, alinhando funcionalidades às necessidades operacionais e garantindo a usabilidade pelas equipes envolvidas."}],"suggestedCompetencies":[{"order":1,"name":"Adaptabilidade e flexibilidade"},{"order":2,"name":"Auto-Critica"},{"order":3,"name":"Cumprimento de prazos finais"},{"order":4,"name":"Disponibilidade"},{"order":5,"name":"Pensamento estraté {"order":1,"group":"Compromisso Valores","text":"Contribuir para manutenção da satisfação e motivação dos recursos humanos, através de estudos, pesquisas e análises de tendências de mercado, recomendando ações e procedimentos na área de remuneração, benefícios, treinamento e desenvolvimento, observando as políticas e diretrizes da empresa nessa área;"},{"order":2,"group":"Planejamento","text":"Assessorar diretoria e setores da empresa, participando de reuniões, implementando planos estratégicos, participando da elaboração do Budget, mediando relações entre colaboradores e gestores, dando suporte para gestores em informações pertinentes ao RH;"},{"order":3,"group":"Controles","text":"Garantir que a elaboração da folha de pagamentos esteja conforme legislação vigente, práticas adotadas pelo mercado e política definida pela empresa, monitorando tratamento de ponto, geração de cálculos e relatórios, emissão e recolhimento dos encargos, realização de levantamento de gastos com pessoal e seus impactos nos custos, visando subsidiar a gerência e direção da empresa na tomada de decisões referentes ao quadro de pessoal;"},{"order":4,"group":"Planejamento","text":"Realizar as implementações de gestão de benefícios e programas na área de saúde e educação, realizando estudos e levantamentos, junto às instituições, do custo e viabilidade de aplicação, a fim de dar sustentação à política de benefícios do RH da empresa;"},{"order":5,"group":"Capacidade Analítica","text":"Elaborar indicadores pertinentes aos processos de RH para colaborar na tomada de decisões e plano de ações de melhorias e monitoramento de satisfação dos colaboradores;"},{"order":6,"group":"Segurança","text":"Acompanhar e validar programas voltados para saúde e segurança ocupacional, tais como: PGR, PCMSO, ASO, PPP, LTCAT, Brigada de Inocêncio, CIPA e demais processos pertinentes, garantindo as exigências legais;"},{"order":7,"group":"Prospecção","text":"Gerenciar o processo de recrutamento e seleção, avaliando necessidade de contratação, desenvolvendo alternativas para captação de talentos, realizando entrevistas, testes, aplicando dinâmicas e apresentando pareceres para colaborar com a tomada de decisão;"},{"order":8,"group":"Planejamento","text":"Orientar e acompanhar os processos de definição da remuneração nos casos de admissão, promoção e transferência de funcionários, observando as normas e diretrizes do Plano de Cargos & Salários;"},{"order":9,"group":"Planejamento","text":"Gerir atividades de treinamento e desenvolvimento, aplicando LNT, elaborando PAT, avaliando consultorias e custos de treinamento;"},{"order":10,"group":"Compromisso Valores","text":"Desenvolver e apoiar ações de comunicação interna que promovam acolhimento, pertencimento e bem-estar, por meio da elaboração de materiais sensíveis e inspiradores para divulgação de eventos, iniciativas motivacionais e mensagens institucionais, fortalecendo os vínculos entre áreas e cultivando um ambiente harmonioso e equilibrado;"}],"suggestedCompetencies":[{"order":1,"name":"Pensamento estratégico e negociação"},{"order":2,"name":"Inteligência Interpessoal"},{"order":3,"name":"Gestão de Conflitos"},{"order":4,"name":"Controle de custos"},{"order":5,"name":"Senso de dono"}]},"KAM":{"responsibilities":[{"order":1,"group":"Capacidade Analítica","text":"Conduzir reuniões consultivas com decisores estratégicos, utilizando metodologia SPIN Selling para explorar Situação, Problema, Implicações e Necessidades de Solução — construindo diagnósticos robustos e personalizados por conta."},{"order":2,"group":"Prospecção","text":"Desenvolver apresentações e propostas comerciais de impacto, aplicando o modelo AIDA (Atenção, Interesse, Desejo e Ação) para despertar engajamento e urgência nas contas-chave."},{"order":3,"group":"Compromisso Valores","text":"Assumir postura provocativa e consultiva frente ao cliente, conforme o modelo Challenger Sales, estimulando reflexão sobre riscos e oportunidades não percebidas — e posicionando a ução dos serviços, antecipando demandas e realizando controles no que tange gestão de pessoas (férias, escalas, horários, horas extras etc.);"},{"order":5,"group":"Capacidade Analítica","text":"Apontar gargalos na operação. Indicar possíveis melhorias na qualidade do atendimento usando novas ferramentas e tecnologias. Elaborar Planos de Ação para corrigir problema sistemáticos."},{"order":6,"group":"Planejamento","text":"Apoiar na definição da agenda do time de campo interno da umgrauemeio."},{"order":7,"group":"Ajuda Mútua","text":"Interagir com outras áreas, participando de projetos de melhorias internas"},{"order":8,"group":"Segurança","text":"Acompanhar a administração, configuração e suporte da infraestrutura de informática da sede, dos colaboradores e licenças de software;"},{"order":9,"group":"Pesquisa","text":"Auxiliar na manutenção e melhoria contínua dos sistemas e bancos de dados da área de operações"}],"suggestedCompetencies":[{"order":1,"name":"Habilidade para analisar e resolver problemas"},{"order":2,"name":"Resiliência"},{"order":3,"name":"Organização"},{"order":4,"name":"Tomada de decisão"},{"order":5,"name":"Pensamento estratégico e negociação"}]},"TÉCNICO EM SEGURANÇA DO TRABALHO":{"responsibilities":[{"order":1,"group":"Gerir Processos","text":"Realizar e conduzir processos de integração de novos colaboradores e terceiros em clientes, incluindo o controle e atualização de documentos exigidos em plataformas específicas, garantindo a aptidão para atuação em campo."},{"order":2,"group":"Compromisso Valores","text":"Participar da elaboração, implementação e divulgação da Política de Saúde e Segurança no Trabalho (SST), promovendo a cultura de prevenção na empresa."},{"order":3,"group":"Capacidade Analítica","text":"Executar inspeções regulares nos ambientes de trabalho para identificar situações de risco, propondo medidas corretivas e preventivas eficazes."},{"order":4,"group":"Planejamento","text":"Elaborar análises de riscos e planos de ação voltados à mitigação de acidentes e doenças ocupacionais."},{"order":5,"group":"Compromisso Valores","text":"Realizar e ministrar treinamentos e capacitações sobre segurança, uso adequado de EPIs e EPCs, procedimentos de emergência, entre outros temas relacionados à SST."},{"order":6,"group":"Segurança","text":"Garantir a conformidade legal da empresa, mantendo-se atualizado sobre a legislação vigente e normas regulamentadoras aplicáveis."},{"order":7,"group":"Ajuda Mútua","text":"Apoiar a área de Recursos Humanos em ações relacionadas à SST, bem como em projetos internos motivacionais, educacionais e eventos corporativos."},{"order":8,"group":"Pesquisa","text":"Acompanhar mudanças nas condições de trabalho, tecnologias e legislações, promovendo atualizações nos programas e procedimentos de segurança."},{"order":9,"group":"Compromisso Valores","text":"Contribuir ativamente para a cultura de segurança, propondo melhorias contínuas e atuando como agente de conscientização junto às equipes operacionais e administrativas."}],"suggestedCompetencies":[{"order":1,"name":"Assertividade"},{"order":2,"name":"Formador de times e equipes (coaching)"},{"order":3,"name":"Criatividade"},{"order":4,"name":"Organização"},{"order":5,"name":"Adaptabilidade e flexibilidade"}]},"TÉCNICO EM PLANEJAMENTO DE MANUTENÇÃO JR":{"responsibilities":[{"order":1,"group":"Planejamento","text":"Desenvolver cronogramas de manutenção e inspeções periódicas, priorizando ações preventivas para reduzir falhas e custos."},{"order":2,"group":"Segurança","text":"Monitorar remotamente o desempenho dos equipamentos e sistemas utilizando ferramentas como Zabbix"},{"order":3,"group":"Planejamento","text":"Propor, planejar e supervisionar remotamente ou presencialmente a execução de projetos de melhoria de infraestrutura, alinhados às demandas operacionais e padrões de qualidade."},{"order":4,"group":"Gerir Processos","text":"Planejar e supervisionar remotamente ou presencialmente a execução de manutenções periódicas ntendo a empresa informada sobre as principais dúvidas dos clientes"},{"order":4,"group":"Conhecimento Técnico","text":"Reparar equipamentos, identificando a instrumentação necessária para correta montagem, avaliando necessidade de troca e/ou conserto, efetuando ajustes e controles;"},{"order":5,"group":"Capacidade Analítica","text":"Analisar relatórios técnicos, validando testes e especificando planos de trabalho"},{"order":6,"group":"Capacitar Pessoas","text":"Ministrar treinamentos de forma a contribuir com a capacidade do time na utilização de tecnologias de transmissão e manter a equipe orientada no que tange segurança, validando e treinando quanto ao uso correto dos EPI’s"}],"suggestedCompetencies":[{"order":1,"name":"Auto-Critica"},{"order":2,"name":"Inteligência Emocional"},{"order":3,"name":"Adaptabilidade e flexibilidade"},{"order":4,"name":"Comunicação"},{"order":5,"name":"Escuta ativa"}]}},"positionList":["ADVOGADO JR","ANALISTA  DE SUPRIMENTOS PL","ANALISTA DE ASSISTÊNCIA TÉCNICA PL","ANALISTA DE ASSISTÊNCIA TÉCNICA SR","ANALISTA DE GENTE & CULTURA JR","ANALISTA DE IMPLANTAÇÃO DE PROJETO JR","ANALISTA DE INOVABILIDADE INDEPENTENDE","ANALISTA DE PROJETOS JR","ANALISTA DE SISTEMAS JR","ANALISTA DE SUCESSO DO CLIENTE JR","ANALISTA DE SUCESSO DO CLIENTE PL","ANALISTA DE SUPORTE TÉCNICO JR","ANALISTA DE SUPORTE TÉCNICO PL","ANALISTA DE SUPORTE TÉCNICO SR","ANALISTA DE SUPRIMENTOS (COMPRAS)","ASSISTENTE DE DIRETORIA JR","ASSISTENTE DE IMPLANTAÇÃO DE PROJETOS PL","ASSISTENTE DE PROJETOS JR","ASSISTENTE DE SUPORTE TÉCNICO PL","ASSISTENTE DE SUPRIMENTOS JR","ASSISTENTE FINANCEIRO JR","CIENTISTA DE DADOS JR","CIENTISTA DE DADOS PL","CIENTISTA DE DADOS SR","CONSULTOR TÉCNICO DE VENDAS JR","CONSULTOR TÉCNICO DE VENDAS SR","COORDENADOR DE GROWTH MARKETING","COORDENADOR DE IMPLANTAÇÃO DE PROJETOS","COORDENADOR DE SUPORTE TÉCNICO","DESENVOLVEDOR FULL STACK JR","DESENVOLVEDOR FULL STACK PL","DESENVOLVEDOR FULL STACK SR","ESPECIALISTA EM INCÊNDIOS FLORESTAIS PL","ESPECIALISTA FINANCEIRO PL","ESPECIALISTA GEO TEC PL","ESPECIALISTA GEOTEC PL","GERENTE ADMINISTRATIVA FINANCEIRA","GERENTE ADMINISTRATIVO(A) FINANCEIRO(A)","GERENTE DE GENTE & CULTURA","GERENTE DE OPERAÇÕES","GERENTE DE PROJETOS FAAAS","KAM","LÍDER DE SUPRIMENTOS JR","SDR ASSISTANT SR","SUPERVISOR DE SUPORTE TÉCNICO","SUPERVISOR DE SUPORTE TÉCNICO JR","TECNICO ESPECIALISTA EM TRANSMISSÃO JR","TÉCNICO EM PLANEJAMENTO DE MANUTENÇÃO JR","TÉCNICO EM SEGURANÇA DO TRABALHO"],"cha":{"Adaptabilidade e flexibilidade":[{"code":"1.1","text":"Ajustar o planejamento de trabalho e o cronograma de tarefas com rapidez sempre que houver mudanças de prioridade da gestão."},{"code":"1.2","text":"Lidar de forma construtiva com imprevistos e volatilidades na rotina, focando na busca por saídas em vez de lamentar as mudanças."},{"code":"1.3","text":"Adotar novos sistemas, ferramentas e processos recomendados pela empresa de forma receptiva, acelerando a própria curva de aprendizado."},{"code":"1.4","text":"Transitar com facilidade entre diferentes frentes de trabalho ou projetos, adequando sua postura técnica ao cenário atual."},{"code":"1.5","text":"Demonstrar abertura para rever as próprias convicções ou métodos de execução quando novas ideias provarem ser mais eficientes para o negócio."}],"Assertividade":[{"code":"2.1","text":"Posicionar-se de maneira firme, transparente e educada em reuniões técnicas, defendendo metodologias eficientes com foco."},{"code":"2.2","text":"Definir objetivos e escopos de trabalho realistas, evitando promessas operacionais que a equipe não consiga cumprir."},{"code":"2.3","text":"Comunicar impasses críticos a fornecedores ou parceiros de campo indo direto ao ponto, com polidez, mas sem rodeios."},{"code":"2.4","text":"Revisar e blindar processos preventivamente com foco em eliminar retrabalhos e evitar prejuízos orçamentários à área."},{"code":"2.5","text":"Argumentar de forma autêntica e objetiva perante contestações, ancorando-se sempre em evidências verificáveis."}],"Auto-Critica":[{"code":"3.1","text":"Auditar voluntariamente as próprias atitudes e códigos de conduta profissional, buscando ativamente pontos cegos de melhoria."},{"code":"3.2","text":"Identificar as próprias limitações técnicas operacionais atuais e sinalizá-las para a gestão em busca de auxílio ou treinamentos."},{"code":"3.3","text":"Evitar culpar fatores externos ou terceiros por erros em processos que estavam sob a sua direta responsabilidade de execução."},{"code":"3.4","text":"Monitorar o próprio nível de rigor nas entregas para não pecar pelo excesso de perfeccionismo improdutivo que trava prazos."},{"code":"3.5","text":"Criar e perseguir metas pessoais de autocorreção comportamental com base nos erros cometidos em ciclos passados."}],"Comprometimento efetivo":[{"code":"4.1","text":"Liderar pelo exemplo prático de conduta, transformando promessas profissionais em entregas e atitudes consistentes na rotina."},{"code":"4.2","text":"Demonstrar forte senso de orgulho profissional em pertencer à organização e alinhar-se ativamente ao propósito da empresa."},{"code":"4.3","text":"Assumir autoresponsabilidade incondicional frente às falhas da sua área, mobilizando recursos imediatos para corrigi-las."},{"code":"4.4","text":"Manter postura proativa frente aos grandes marcos contratuais da empresa, engajando-se na busca por eficiência extrema."},{"code":"4.5","text":"Empenhar esforços intelectuais e técnicos substanciais para garantir que os projetos estratégicos da área sejam bem-sucedidos."}],"Comunicação":[{"code":"5.1","text":"Expressar ideias e conceitos técnicos de forma clara, objetiva e sintetizada, facilitando a rápida compreensão do interlocutor."},{"code":"5.2","text":"Escolher estrategicamente o canal de comunicação correto (Zendesk, e-mail, reunião, WhatsApp) dependendo da urgência e do teor do assunto."},{"code":"5.3","text":"Transmitir pontos críticos e riscos de processos de maneira direta e transparente, sem omitir detalhes que afetem o negócio."},{"code":"5.4","text":"Certificar-se ativamente de que a mensagem enviada foi compreendida pelo receptor, minimizando riscos de interpretações errôneas."},{"code":"5.5","text":"tornar e fazer o follow-up contínuo de pautas e alinhamentos pendentes até que o assunto esteja formalmente resolvido."}],"Controle de custos":[{"code":"6.1","text":"Estudar e monitorar as despesas operacionais e custos vinculados às atividades diretas da sua área de trabalho."},{"code":"6.2","text":"Demonstrar disciplina financeira e racionalidade de consumo em cada ação operacional que demande aportes financeiros da empresa."},{"code":"6.3","text":"Zelar por pequenas ações diárias de contenção de desperdícios no uso de infraestrutura, materiais, computação e insumos."},{"code":"6.4","text":"Questionar rotinas vigentes buscando ativamente formas de gerar maior produtividade individual com menor aplicação de recursos."},{"code":"6.5","text":"Estimular a mentalidade de eficiência orçamentária entre os pares, apoiando a companhia na busca por saúde e perenidade financeira."}],"Criatividade":[{"code":"7.1","text":"Desenvolver alternativas técnicas originais e fora do óbvio para solucionar problemas crônicos de sistemas ou infraestrutura."},{"code":"7.2","text":"Buscar referências, metodologias ágeis e tecnologias modernas de mercado para injetar inovação nos processos vigentes."},{"code":"7.3","text":"Formular hipóteses e cenários disruptivos (\"E se?\") para flexibilizar modelos mentais engessados dentro da equipe."},{"code":"7.4","text":"Desenhar soluções de contorno temporárias inteligentes que poupem recursos orçamentários da empresa em momentos críticos."},{"code":"7.5","text":"Conciliar restrições técnicas severas com desenhos de fluxos elegantes, funcionais e focados em excelente usabilidade."}],"Cumprimento de prazos finais":[{"code":"8.1","text":"Cumprir com consistência e rigor os tempos e prazos finais firmados em contratos, SLAs de suporte ou metas internas."},{"code":"8.2","text":"Alertar antecipadamente o gestor imediato caso mapeie falhas de recursos ou riscos reais de atraso em um prazo acordado."},{"code":"8.3","text":"Compreender e detalhar no início do projeto todas as datas e dependências críticas necessárias para a entrega final bem-sucedida."},{"code":"8.4","text":"Acionar ajuda de colegas experientes ou especialistas de forma tempestiva sempre que notar impasses técnicos bloqueantes."},{"code":"8.5","text":"Documentar os fatores externos que provocaram desvios de cronograma, propondo soluções estruturais para que o atraso não se repita."}],"Desenvoltura oral e escrita":[{"code":"9.1","text":"Dominar as normas da linguagem escrita e utilizá-las de forma corporativa para redigir relatórios, chamados ou e-mails limpos e precisos."},{"code":"9.2","text":"Fazer apresentações verbais ou atualizações em reuniões com ótima postura, fluência de raciocínio e tom de voz seguro."},{"code":"9.3","text":"Revisar minuciosamente textos de relevância crítica antes de dispará-los, garantindo precisão gramatical e contextual."},{"code":"9.4","text":"Adaptar o vocabulário e a complexidade técnica da fala ao nível de maturidade e perfil do público-alvo (da operação à diretoria)."},{"code":"9.5","text":"Sintetizar dados massivos e transformá-los em mensagens escritas concisas de rápida leitura e forte poder de convencimento."}],"Disponibilidade":[{"code":"10.1","text":"Estar acessível e aberto a solicitações urgentes da liderança ou de colegas, demonstrando prontidão profissional no cotidiano."},{"code":"10.2","text":"Manifestar-se voluntariamente para assumir projetos complexos ou demandas não mapeadas das quais ninguém queira se encarregar."},{"code":"10.3","text":"Responder às comunicações e chamados internos dentro de tempos razoáveis, não retendo processos corporativos importantes por lentidão."},{"code":"10.4","text":"Oferecer-se de livre e espontânea vontade para dar apoio operacional a outras áreas da empresa em momentos de pico de demanda."},{"code":"10.5","text":"Demonstrar hospitalidade e paciência ao acolher profissionais recém-chegados na organização ou que mudaram de setor de trabalho."}],"Empatia":[{"code":"11.1","text":"Colocar-se genuinamente no lugar de colegas e clientes para compreender seus contextos, limitações e dores reais."},{"code":"11.2","text":"Considerar os impactos humanos e os pontos de vista alheios antes de propor ou executar decisões operacionais na área."},{"code":"11.3","text":"Oferecer suporte e escuta atenta a membros do time que estejam passando por momentos de sobrecarga técnica ou estresse profissional."},{"code":"11.4","text":"Evitar reações defensivas imediatas, validando as intenções e as motivações por trás das atitudes ou falhas alheias."},{"code":"11.5","text":"Fomentar um ambiente psicologicamente seguro onde as pessoas se sintam à vontade para expressar suas opiniões sinceras."}],"Escuta ativa":[{"code":"12.1","text":"Ouvir atentamente os interlocutores sem interrupções, demonstrando interesse real pelo que está sendo dito."},{"code":"12.2","text":"Certificar-se do entendimento da mensagem repetindo ou resumindo os pontos principais antes de responder."},{"code":"12.3","text":"Observar sinais não verbais e o contexto da fala para captar necessidades que não foram ditas explicitamente."},{"code":"12.4","text":"Abster-se de formular respostas ou defesas mentalmente enquanto a outra pessoa ainda está explicando sua visão."},{"code":"12.5","text":"Fazer perguntas investigativas e inteligentes que ajudem o outro a aprofundar e clarear a ideia apresentada."}],"Ética":[{"code":"13.1","text":"Respeitar e cumprir integralmente o Código de Conduta, as normas de segurança e os procedimentos operacionais padrão do Grupo."},{"code":"13.2","text":"Agir com retidão, justiça e integridade em todas as interações profissionais com colegas, subordinados e fornecedores externos."},{"code":"13.3","text":"Preservar de forma absoluta o sigilo profissional de dados cadastrais e segredos industriais sob custódia da empresa."},{"code":"13.4","text":"Repudiar e reportar atitudes ou privilégios que firam os princípios de equidade e conformidade regulatória corporativa."},{"code":"13.5","text":"Colaborar para a manutenção de um clima organizacional saudável, pautado pelo respeito à diversidade e à integridade humana."}],"Feedback":[{"code":"14.1","text":"Praticar a cultura do retorno contínuo de informações com subordinados, pares e liderança de forma madura e estruturada."},{"code":"14.2","text":"Estruturar feedbacks de melhoria baseando-se estritamente em exemplos de situações e comportamentos reais e observáveis."},{"code":"14.3","text":"Solicitar feedbacks sobre a própria atuação técnica de forma aberta e voluntária, encarando os retornos como guias de melhoria."},{"code":"14.4","text":"Apontar os comportamentos que geraram um impacto inadequado focando no desenvolvimento e no desejo de evolução do outro."},{"code":"14.5","text":"Destacar e elogiar publicamente os comportamentos exemplares observados na rotina, estimulando a alta performance do grupo."}],"Formador de times e equipes (coaching)":[{"code":"15.1","text":"Compartilhar conhecimentos e segredos operacionais sem receios, focando na elevação do patamar técnico médio de toda a equipe."},{"code":"15.2","text":"Conduzir mentorias e alinhamentos de desenvolvimento técnico com profissionais juniores para acelerar suas curvas de aprendizado."},{"code":"15.3","text":"Delegar tarefas operacionais desafiadoras calculadas conforme o nível de maturidade e a capacidade de entrega de cada liderado."},{"code":"15.4","text":"Reconhecer publicamente evoluções, conquistas operacionais e atitudes de alta performance observadas nos membros da equipe."},{"code":"15.5","text":"Influenciar a cultura do time através do próprio exemplo de dedicação, integridade técnica e atitude profissional impecável."}],"Gestão de Conflitos":[{"code":"16.1","text":"Intervir de maneira neutra e tempestiva diante de desentendimentos e atritos entre colegas de equipe ou áreas parceiras."},{"code":"16.2","text":"Conduzir conversas e mediações difíceis com foco exclusivo em fatos e dados, deixando julgamentos ou opiniões pessoais de fora."},{"code":"16.3","text":"Estimular o diálogo aberto e transparente para que as partes em litígio encontrem um denominador comum sustentável."},{"code":"16.4","text":"Identificar comportamentos passivo-agressivos ou ruídos de humor na equipe, agindo preventivamente antes que escalem para conflitos abertos."},{"code":"16.5","text":"Consolidar o alinhamento e o foco nos resultados organizacionais logo após a resolução de uma crise de relacionamento interna."}],"Habilidade para analisar e resolver problemas":[{"code":"17.1","text":"Mapear processos complexos de ponta a ponta utilizando ferramentas analíticas estruturadas (PDCA, Diagrama de Causa e Efeito)."},{"code":"17.2","text":"Organizar e cruzar logs de erros, relatórios e métricas de sistemas para coletar evidências técnicas ágeis."},{"code":"17.3","text":"Investigar profundamente anomalias de sistemas atuando diretamente na causa raiz, evitando soluções superficiais temporárias."},{"code":"17.4","text":"Desenhar e formalizar fluxogramas e Gráficos de Pareto para estruturar novos fluxos operacionais à prova de falhas."},{"code":"17.5","text":"Acoplar ideias inovadoras e criatividade prática à engenharia de processos, gerando saltos de eficiência operacional no setor."}],"Iniciativa":[{"code":"18.1","text":"Agir preventivamente para mitigar riscos técnicos ou falhas operacionais antes que a liderança precise emitir comandos."},{"code":"18.2","text":"Apresentar sugestões inovadoras viáveis para otimizar os fluxos processuais e elevar os patamares de produtividade do time."},{"code":"18.3","text":"Executar as demandas diárias com alto nível de autonomia e determinação, sem necessidade de microgerenciamento constante."},{"code":"18.4","text":"Buscar de forma independente os dados e recursos necessários para solucionar impasses operacionais de campo."},{"code":"18.5","text":"Propor projetos pilotos internos ou melhorias de infraestrutura assumindo a liderança do plano de ação inicial."}],"Inteligência Emocional":[{"code":"19.1","text":"Identificar os próprios gatilhos emocionais corporativos no momento em que ocorrem, aplicando autocontrole sob forte estresse."},{"code":"19.2","text":"Conduzir conversas e decisões complexas blindando o ambiente de trabalho de oscilações de humor ou frustrações pessoais."},{"code":"19.3","text":"Canalizar sentimentos de pressão ou ansiedade operacional em energia de execução focada no atingimento dos objetivos."},{"code":"19.4","text":"Ler as reações emocionais de colegas e liderados, calibrando a intensidade da cobrança para não ultrapassar limites nocivos."},{"code":"19.5","text":"Absorver frustrações de projetos ou reveses de campo mantendo a compostura profissional e transmitindo segurança ao time."}],"Inteligência Interpessoal":[{"code":"20.1","text":"Mapear e compreender as dinâmicas sociais da empresa, sabendo transitar e se relacionar com diferentes perfis e níveis hierárquicos."},{"code":"20.2","text":"Estabelecer conexões e alianças de trabalho baseadas na confiança profissional mútua e no respeito às individualidades."},{"code":"20.3","text":"Demonstrar sensibilidade social ao captar necessidades latentes, antecipando potenciais gargalos de relacionamento no ecossistema de trabalho."},{"code":"20.4","text":"Atuar com diplomacia profissional no dia a dia, evitando ruídos de convivência e agindo com moderação."},{"code":"20.5","text":"Construir redes internas de apoio técnico e corporativo que facilitem o andamento de projetos e processos multidisciplinares."}],"Mentalidade de crescimento (Aprendizado contínuo)":[{"code":"21.1","text":"Buscar ativamente o domínio de novos conhecimentos corporativos, ferramentas tecnológicas e tendências do setor por conta própria."},{"code":"21.2","text":"Desafiar-se voluntariamente a assumir tarefas complexas fora do seu escopo tradicional para expandir seu repertório técnico."},{"code":"21.3","text":"Desenvolver testes e experimentos em baixa escala na rotina, aplicando conceitos novos de mercado para medir eficácia."},{"code":"21.4","text":"Atuar como polo difusor de conhecimento técnico dentro da squad, compartilhando artigos, cursos e boas práticas."},{"code":"21.5","text":"Encarar transições processuais desafiadoras na empresa como alavancas valiosas de projeção e crescimento profissional."}],"Organização":[{"code":"22.1","text":"Estruturar e padronizar o próprio ambiente de trabalho digital e físico em conformidade com as normas e instruções da empresa."},{"code":"22.2","text":"Limitar e gerenciar estrategicamente o tempo dedicado para a execução de cada tarefa operacional, evitando gargalos na fila de trabalho."},{"code":"22.3","text":"Utilizar somente os materiais de apoio e dados homologados que se destinam estritamente à conclusão da atividade do momento."},{"code":"22.4","text":"Automatizar tarefas manuais ou rotinas repetitivas utilizando os sistemas internos para destravar eficiência."},{"code":"22.5","text":"Isolar focos de distração e interrupções externas durante a execução de tarefas críticas que exijam profunda concentração."}],"Orientado para resultados":[{"code":"23.1","text":"Desenhar planos de trabalho eficientes focados unicamente em bater as metas estratégicas e operacionais acordadas com a diretoria."},{"code":"23.2","text":"Administrar a rotina gerenciando o tempo com energia extrema voltada à qualidade do resultado final, e não apenas ao esforço."},{"code":"23.3","text":"Acompanhar os indicadores numéricos de performance individual (KPIs), realizando correções de rota diárias diante de desvios."},{"code":"23.4","text":"Transpor barreiras burocráticas ou dificuldades técnicas com proatividade para resguardar a integridade dos resultados positivos da empresa."},{"code":"23.5","text":"Manter o foco estratégico inabalável nas entregas de real valor corporativo, mesmo em períodos de alto volume de demandas acessórias."}],"Pensamento estratégico e negociação":[{"code":"24.1","text":"Analisar o caos de informações diárias conectando dados dispersos para prever tendências operacionais de médio e longo prazo."},{"code":"24.2","text":"Estruturar negociações de escopo e prazos com múltiplos stakeholders internos visando soluções duradouras do tipo ganha-ganha."},{"code":"24.3","text":"Alinhar cada pequena atividade técnica diária aos macro-objetivos de negócio e expansão determinados pela alta gestão."},{"code":"24.4","text":"Persuadir e engajar equipes e prestadores de serviço em torno de novas ideias utilizando argumentações lógicas amparadas em fatos."},{"code":"24.5","text":"Mapear o tabuleiro de influências e impactos operacionais internos antes de implementar mudanças de rotina na área."}],"Priorização correta de tarefas":[{"code":"25.1","text":"Manter uma visão holística e clara dos objetivos estratégicos da área, alinhando prioridades em conjunto com a gestão."},{"code":"25.2","text":"Classificar as demandas diárias através de matrizes de relevância, separando o que é verdadeiramente urgente do que é acessório."},{"code":"25.3","text":"Construir e respeitar um cronograma realista de entregas individuais, atualizando os marcos de progresso periodicamente."},{"code":"25.4","text":"Equilibrar o ritmo operacional extremo com pausas necessárias de recuperação, preservando a energia focada na alta performance."},{"code":"25.5","text":"Atualizar os blocos de tarefas diários diante de novos inputs ou chamados críticos urgentes que exijam resposta imediata."}],"Resiliência":[{"code":"26.1","text":"Manter a calma e o foco na resolução do problema diante de situações estressantes ou de alta pressão."},{"code":"26.2","text":"Enxergar os erros e falhas como oportunidades de aprendizado, recuperando-se rapidamente de feedbacks negativos."},{"code":"26.3","text":"Adaptar-se de maneira positiva e produtiva a cenários de crise ou mudanças abruptas no andamento dos projetos."},{"code":"26.4","text":"Demonstrar persistência frente a obstáculos complexos, buscando caminhos alternativos sem desanimar."},{"code":"26.5","text":"Separar as emoções pessoais dos desafios profissionais, preservando a integridade das entregas e o clima da equipe."}],"Senso de dono":[{"code":"27.1","text":"Tomar para si a responsabilidade integral pelo sucesso da meta da área, eliminando posturas de terceirização de problemas."},{"code":"27.2","text":"Agir prontamente para corrigir falhas e resolver gargalos operacionais da empresa mesmo quando fora do seu escopo imediato"},{"code":"27.3","text":"Cuidar do patrimônio móvel, ativos tecnológicos e recursos financeiros corporativos com o mesmo nível de zelo que dedica aos seus bens."},{"code":"27.4","text":"Avaliar problemas isolados sob o ponto de vista do impacto financeiro global no negócio, escolhendo caminhos que blindem a empresa."},{"code":"27.5","text":"Assumir os riscos e as consequências das decisões tomadas na rotina de maneira madura, prestando contas de forma límpida."}],"Tomada de decisão":[{"code":"28.1","text":"Decidir por caminhos técnicos ou operacionais complexos sob cenários de incerteza, baseando-se em matrizes de dados consolidadas."},{"code":"28.2","text":"Assumir a liderança em momentos de impasse operacional na squad, escolhendo o direcionamento mais seguro a seguir."},{"code":"28.3","text":"Avaliar rapidamente os prós, contras e riscos associados a cada alternativa técnica de resolução de chamados em campo."},{"code":"28.4","text":"Tomar decisões céleres dentro dos limites de alçada do cargo, evitando a paralisação de fluxos por excesso de validações."},{"code":"28.5","text":"Alinhar as decisões operacionais tomadas às diretrizes de compliance, ética e planos de sustentabilidade de longo prazo da empresa."}],"Trabalho em equipe / Cooperação":[{"code":"29.1","text":"Cooperar ativamente no compartilhamento de ideias, ferrament <script>
(function(){
"use strict";

// Guarda a estrutura original da página (cabeçalho, menu, área de conteúdo)
// antes de a tela de login poder substituí-la — sem isso, depois de logar,
// o código tentava preencher elementos que a tela de login tinha apagado.
var APP_SHELL_HTML = document.getElementById("app").innerHTML;

/* ============================================================================
   Login Microsoft (Azure AD / Entra ID) — restringe o acesso a contas
   @umgrauemeio.com. Usa o provedor "Microsoft" já embutido no Firebase
   Authentication (fluxo de redirecionamento: ao clicar em entrar, o
   navegador sai para a tela de login da Microsoft e volta sozinho para esta
   mesma página). Usar o Firebase Authentication (em vez de uma biblioteca à
   parte) é o que permite travar o próprio banco de dados por trás — ver as
   regras do Firestore em CONFIGURAR.md — e não só esconder o botão de
   entrar de quem não é da UGM.
   ============================================================================ */
var MSAUTH_TENANT_ID = "4dfe5bc6-6a39-47cd-8451-812a19ef991b";
var MSAUTH_ALLOWED_DOMAIN = "umgrauemeio.com";

/* ============================================================================
   Banco de dados (Firebase Firestore) — substitui o armazenamento que antes
   vinha do Claude. Preencha com as chaves do SEU projeto Firebase (ver
   CONFIGURAR.md). Enquanto ficar com "COLE_AQUI...", a ferramenta roda em
   modo de demonstração local (dados de exemplo, nada é salvo de verdade).
   ============================================================================ */
var FIREBASE_CONFIG = {
  apiKey: "AIzaSyAkYPjUAkAjUv_LdwXxI5VeawUSoTx8Zrw",
  authDomain: "avaliacao-ugm.firebaseapp.com",
  projectId: "avaliacao-ugm",
  storageBucket: "avaliacao-ugm.firebasestorage.app",
  messagingSenderId: "398710260270",
  appId: "1:398710260270:web:e64e2979271ffa0be4d5bf"
};
var FIREBASE_READY = FIREBASE_CONFIG.apiKey.indexOf("COLE_AQUI")!==0;
if(FIREBASE_READY) firebase.initializeApp(FIREBASE_CONFIG);

var MSAuth = (function(){
  var currentUser = null;
  var lastError = null;

  function dataFromFirebaseUser(fbUser, profile){
    var email = (fbUser.email || "").toLowerCase();
    // Contas corporativas (Azure AD) às vezes não preenchem fbUser.email — nesse
    // caso, usamos o e-mail que vem no perfil bruto devolvido pela própria
    // Microsoft no momento do login (additionalUserInfo.profile), como reserva.
    if(!email && profile) email = (profile.mail || profile.userPrincipalName || profile.email || "").toLowerCase();
    return { name: fbUser.displayName || email, email: email };
  }
  function checkDomain(data){
    if(!data.email || data.email.indexOf("@"+MSAUTH_ALLOWED_DOMAIN)===-1){
      lastError = {error:"wrong_domain", description:data.email||"(a Microsoft não devolveu um e-mail para esta conta)"};
      currentUser = null;
      firebase.auth().signOut();
      return null;
    }
    currentUser = data;
    return data;
  }

  var readyPromise;
  if(!FIREBASE_READY){
    // Firebase ainda não configurado (ver CONFIGURAR.md): libera a ferramenta
    // sem exigir login, só pra dar pra conferir a aparência/funcionamento.
    readyPromise = Promise.resolve({ name:"Modo de demonstração (Firebase não configurado)", email:"" });
  } else {
    // Login via pop-up (não redirecionamento de página inteira): o GitHub Pages
    // e o endereço do Firebase (firebaseapp.com) são domínios diferentes, e o
    // fluxo de redirecionamento de página inteira estava perdendo a sessão no
    // meio do caminho entre os dois. Pop-up evita isso — a janela e a página
    // conversam direto, sem precisar "lembrar" nada entre uma navegação e outra.
    readyPromise = new Promise(function(resolve){
      firebase.auth().onAuthStateChanged(function(fbUser){
        if(!fbUser){ currentUser = null; resolve(null); return; }
        resolve(checkDomain(dataFromFirebaseUser(fbUser)));
      });
    });
  }

  return {
    ready: readyPromise,
    current: function(){ return currentUser; },
    lastError: function(){ return lastError; },
    logout: function(){ firebase.auth().signOut().then(function(){ location.reload(); }); },
    signIn: function(){
      var msProvider = new firebase.auth.OAuthProvider("microsoft.com");
      msProvider.setCustomParameters({ tenant: MSAUTH_TENANT_ID, prompt: "select_account" });
      return firebase.auth().signInWithPopup(msProvider).then(function(result){
        var profile = result.additionalUserInfo && result.additionalUserInfo.profile;
        var data = checkDomain(dataFromFirebaseUser(result.user, profile));
        if(!data){ var e = new Error("wrong_domain"); e.code = "wrong_domain"; throw e; }
        return data;
      });
    }
  };
})();

var RH_PASSCODE = "ugm-rh-2026";
/* ---- acesso por e-mail: RH vê tudo; colaborador/gestor só vê o que é deles ---- */
var RH_ADMIN_EMAILS = ["angelica.bernardes@umgrauemeio.com"];
function currentUserEmail(){ var u = (typeof MSAuth!=="undefined" && MSAuth.current) ? MSAuth.current() : null; return u ? (u.email||"").toLowerCase() : ""; }

function canSeeEvaluation(e){

  var mine = currentUserEmail();

}
function isRHUnlocked(){ try{ return localStorage.getItem("rh_unlocked")==="1"; }catch(ex){ return false; } }
function setRHUnlocked(v){ try{ localStorage.setItem("rh_unlocked", v?"1":"0"); }catch(ex){} }
function updateRHButton(){
  var btn = document.getElementById("rh-gate-btn");

        (unlocked ?
          '<p class="hint">Este navegador está com acesso de RH liberado (o botão de imprimir/PDF aparece nas avaliações).</p>'+
          '<button class="btn danger" id="rh-lock">Bloquear acesso RH neste navegador</button>'
        :
          '<p class="hint">Só o RH deve imprimir ou exportar o PDF — a avaliação só é oficial depois de assinada. Digite a senha de acesso do RH para liberar o botão de impressão neste navegador.</p>'+

        )+
      '</div>'+
    '</div>';
  document.getElementById("modal-close").addEventListener("click", closeNotifyModal);
  document.getElementById("modal-overlay").addEventListener("click", function(ev){ if(ev.target.id==="modal-overlay") closeNotifyModal(); });
  var lockBtn = document.getElementById("rh-lock");
  if(lockBtn) lockBtn.addEventListener("click", function(){ setRHUnlocked(false); closeNotifyModal(); updateRHButton(); render(); });
  var unlockBtn = document.getElementById("rh-unlock");
  if(unlockBtn) unlockBtn.addEventListener("click", function(){

    if(val===RH_PASSCODE){ setRHUnlocked(true); closeNotifyModal(); toast("Acesso RH liberado neste navegador."); updateRHButton(); render(); }

/* ---- prazos e notificação por e-mail ----
   MODO DE TESTE: ainda não existe coluna de e-mail na aba "Colaboradores" nem
   lista de e-mail dos gestores, então por pedido da Angélica todo mundo recebe
   o e-mail dela até validarmos o fluxo. Quando a planilha tiver e-mails reais,
   troque TEST_EMAIL_OVERRIDE por null para usar CATALOG.employees[].email. */
var TEST_EMAIL_OVERRIDE = "angelica.bernardes@umgrauemeio.com";
var SELF_DEADLINE_DAYS = 10;      // prazo do colaborador para a autoavaliação
var FEEDBACK_DEADLINE_DAYS = 60;  // prazo do gestor para a avaliação de feedback (~2 meses)

/* Quem chega direto por um link de avaliação específica (e-mail de notificação)
   não deveria esbarrar na lista completa de avaliações dos colegas — não é uma
   segurança de verdade (não existe login nesta ferramenta), só evita que a
   pessoa clique sem querer em "Painel" e veja o que não é dela. Guardamos isso
   já na primeira leitura da URL, antes de qualquer navegação interna trocar o
   hash. Quem tem o acesso RH liberado sempre vê tudo normalmente. */
var RESTRICTED_ENTRY = /^#\/avaliacao\//.test(location.hash);

function scoreLabel(n){ return n?SCORE_LABELS[n]:""; }
function weightLabel(n){ return n?WEIGHT_LABELS[n]:""; }
function fmt1(n){ return (Math.round(n*10)/10).toFixed(1).replace(".",","); }
function esc(s){ return (s==null?"":String(s)).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
function uid(){ return "e"+Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function todayISO(){ return dateToISO(new Date()); }
function dateToISO(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function addDaysISO(iso, days){ var p=(iso||todayISO()).split("-").map(Number); var d=new Date(p[0],p[1]-1,p[2]); d.setDate(d.getDate()+days); return dateToISO(d); }
function daysBetweenToday(iso){ if(!iso) return null; var p=iso.split("-").map(Number); var target=new Date(p[0],p[1]-1,p[2]); var now=new Date(); var t0=new Date(now.getFullYear(),now.getMonth(),now.getDate()); return Math.round((target-t0)/86400000); }
function fmtDateISOtoBR(iso){ if(!iso) return ""; var p=iso.split("-"); return p.length===3? (p[2]+"/"+p[1]+"/"+p[0]) : iso; }
function nowBR(){ var d=new Date(); return String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0")+"/"+d.getFullYear()+" "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); }

function deadlineBadge(iso){
  if(!iso) return "";
  var n = daysBetweenToday(iso);
  var cls = "st-self", text = "Prazo "+fmtDateISOtoBR(iso)+" · "+n+" dias";
  if(n<0){ cls="sc-1"; text = "Atrasado "+Math.abs(n)+"d · prazo era "+fmtDateISOtoBR(iso); }
  else if(n===0){ cls="sc-2"; text = "Vence hoje"; }
  else if(n<=2){ cls="sc-2"; text = "Vence em "+n+"d ("+fmtDateISOtoBR(iso)+")"; }
  else { cls="st-draft"; text = "Prazo "+fmtDateISOtoBR(iso)+" · "+n+"d restantes"; }
  return '<span class="pill '+cls+'"><span class="dot"></span>'+text+'</span>';
}

/* Shows a panel with the ready-made e-mail (to/subject/body): a real, plain
   mailto link the person can click themselves (works when the OS/browser has
   a mail app registered), plus a "copy" fallback that always works even when
   it doesn't — never auto-triggers navigation, so a missing mail handler
   can't leave the page stuck on a blank tab. */
function evalLink(id){ return location.origin+location.pathname+"#/avaliacao/"+id; }
function mailtoHref(to, subject, body){
  return "mailto:"+encodeURIComponent(to)+"?subject="+encodeURIComponent(subject)+"&body="+encodeURIComponent(body);
}
function showNotifyModal(opts){
  var host = document.getElementById("modal-host");
  host.innerHTML =
    '<div class="modal-overlay" id="modal-overlay">'+
      '<div class="modal-card">'+
        '<div class="modal-head"><h3>'+esc(opts.title)+'</h3><button class="icon-btn" id="modal-close" aria-label="Fechar">✕</button></div>'+
        '<p class="hint">Clique em <b>Enviar</b> para abrir uma nova aba que entrega a mensagem já pronta para o seu programa de e-mail padrão (Outlook, por exemplo) — igual ao "Enviar ao GC" do painel de férias. Se o computador não tiver um programa de e-mail configurado como padrão, o navegador pode avisar isso em vez de abrir o Outlook — nesse caso, use <b>Copiar</b> e cole manualmente. "Copiar mensagem" sempre funciona, em qualquer situação.</p>'+
        '<div class="field"><label>Para</label><input type="text" readonly value="'+esc(opts.to)+'"></div>'+
        '<div class="field"><label>Assunto</label><input type="text" readonly value="'+esc(opts.subject)+'"></div>'+
        '<div class="field"><label>Mensagem</label><textarea readonly rows="7" id="modal-body">'+esc(opts.body)+'</textarea></div>'+
        '<div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;align-items:center;">'+
          '<button class="btn" id="modal-cancel">Cancelar</button>'+
          '<button class="btn" id="modal-copy">📋 Copiar</button>'+
          '<a class="btn primary" id="modal-send" href="'+mailtoHref(opts.to,opts.subject,opts.body)+'" target="_blank" rel="noopener">📧 Enviar</a>'+
        '</div>'+
      '</div>'+
    '</div>';
  document.getElementById("modal-close").addEventListener("click", closeNotifyModal);
  document.getElementById("modal-cancel").addEventListener("click", closeNotifyModal);
  document.getElementById("modal-overlay").addEventListener("click", function(ev){ if(ev.target.id==="modal-overlay") closeNotifyModal(); });
  document.getElementById("modal-copy").addEventListener("click", function(){
    var full = "Para: "+opts.to+"\nAssunto: "+opts.subject+"\n\n"+opts.body;
    var done = function(){ toast("Mensagem copiada."); };
    var fail = function(){
      var ta = document.getElementById("modal-body"); ta.focus(); ta.select();
      toast("Não deu para copiar automaticamente — texto selecionado, use Ctrl+C.");
    };
    if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(full).then(done, fail);
    else fail();
  });
}
function closeNotifyModal(){ document.getElementById("modal-host").innerHTML = ""; }
